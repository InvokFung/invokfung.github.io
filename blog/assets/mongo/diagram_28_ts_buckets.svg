<rect x="0.75" y="0.75" width="998.5" height="662.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Time-series collections: events in, buckets on disk</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">You insert one document per event. MongoDB groups them by metaField + time window, out of sight.</text>
<rect x="40.0" y="96.0" width="920.0" height="41.5" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/>
<text x="54.0" y="120.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start">db.createCollection("metrics", { timeseries: { timeField: "ts", metaField: "host", granularity: "seconds" } })</text>
<text x="40.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">WHAT YOU INSERT — one document per event</text>
