<text x="56.0" y="603.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">delete the bucket.</text>
<rect x="352.0" y="522.0" width="296.0" height="96.0" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="368.0" y="547.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#7c3aed" text-anchor="start">Limited indexes</text>
<text x="368.0" y="569.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Mostly timeField + metaField.</text>
<text x="368.0" y="586.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Cardinality-heavy $group is</text>
<text x="368.0" y="603.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">still bound by RAM.</text>
<rect x="664.0" y="522.0" width="296.0" height="96.0" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="680.0" y="547.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="start">Ceiling (rule of thumb)</text>
<text x="680.0" y="569.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">~50–100k writes/s per primary.</text>
<text x="680.0" y="586.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Beyond that, sharding helps,</text>
<text x="680.0" y="603.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">but costs grow.</text>
<text x="40.0" y="646.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: the post, Chapters 1 and 3. Events and values are sample data; the post gives no window length.</text>
</svg>