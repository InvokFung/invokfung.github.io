<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="RAG query path: embed the question, hybrid vector and lexical search, merge and score, rerank to five chunks, then a cited, streamed answer">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="690" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="688.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">From question to cited answer</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The query path of answer_stream(): search wide, then narrow down to 5 chunks for the prompt.</text>
<rect x="40.0" y="98.0" width="920.0" height="46.0" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="58.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Question</text>
<line x1="132.0" y1="121.0" x2="168.0" y2="121.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<text x="176.0" y="126.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">embed([query])</text>
<text x="302.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">with text-embedding-3-large</text>
<line x1="492.0" y1="121.0" x2="528.0" y2="121.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<text x="536.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">one 3072-dim query vector</text>
<polygon points="40.0,170.0 380.0,170.0 355.0,228.0 65.0,228.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round"/>
<text x="210.0" y="197.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">200</text>
<text x="210.0" y="216.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">vector candidates</text>
<line x1="388.0" y1="199.0" x2="398.0" y2="199.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="410.0" y="195.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="start">$vectorSearch</text>
<text x="521.5" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">on chunks_vec</text>
<text x="410.0" y="216.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">numCandidates: 200 is the HNSW search width; optional filter: metadata.tenant</text>
<polygon points="65.0,234.0 208.0,234.0 208.0,292.0 90.0,292.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="212.0,234.0 355.0,234.0 330.0,292.0 212.0,292.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/>
<text x="145.5" y="261.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">20</text>
<text x="145.5" y="280.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">vector</text>
<text x="274.5" y="261.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">20</text>
<text x="274.5" y="280.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">lexical</text>
<line x1="363.0" y1="263.0" x2="398.0" y2="263.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="410.0" y="259.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="start">limit: 20</text>
<text x="489.7" y="259.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">vector hits, plus the top 20 lexical hits</text>
<text x="410.0" y="280.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">$unionWith runs $search on chunks_text, then $limit: 20</text>
<polygon points="90.0,298.0 330.0,298.0 305.0,356.0 115.0,356.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-linejoin="round"/>
<text x="210.0" y="325.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#d97706" text-anchor="middle">≤ 40</text>
<text x="210.0" y="344.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">unique chunks</text>
<line x1="338.0" y1="327.0" x2="398.0" y2="327.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="410.0" y="323.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="start">$group</text>
<text x="465.8" y="323.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">by _id merges chunks found by both</text>
<text x="410.0" y="344.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">combined = 0.6 × vec_score + 0.4 × lex_score (tune the weights)</text>
<polygon points="115.0,362.0 305.0,362.0 275.0,420.0 145.0,420.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-linejoin="round"/>
<text x="210.0" y="389.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#d97706" text-anchor="middle">20</text>
<text x="210.0" y="408.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">top by score</text>
<line x1="313.0" y1="391.0" x2="398.0" y2="391.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="410.0" y="387.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="start">$sort</text>
<text x="457.8" y="387.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">by combined, then $limit k</text>
<text x="410.0" y="408.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">answer_stream() calls retrieve_hybrid(query, k=20)</text>
<polygon points="145.0,426.0 275.0,426.0 250.0,484.0 170.0,484.0" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" stroke-linejoin="round"/>
<text x="210.0" y="453.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">5</text>
<text x="210.0" y="472.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="middle">reranked</text>
<line x1="283.0" y1="455.0" x2="398.0" y2="455.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="410.0" y="451.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#0d9488" text-anchor="start">rerank()</text>
<text x="481.7" y="451.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">a cross-encoder scores each pair</text>
<text x="410.0" y="472.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Cohere rerank-english-v3.0, top_n = 5</text>
<line x1="210.0" y1="488.0" x2="210.0" y2="512.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="40.0" y="516.0" width="440.0" height="104.0" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="58.0" y="544.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">assemble_prompt()</text>
<text x="58.0" y="568.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Context: [1] … [5], each with (source: id)</text>
<text x="58.0" y="588.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">System: use ONLY the context, cite [n], and</text>
<text x="58.0" y="607.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">say so if the context lacks the answer.</text>
<line x1="484.0" y1="568.0" x2="516.0" y2="568.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="520.0" y="516.0" width="440.0" height="104.0" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="538.0" y="544.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">GPT-4o</text>
<text x="600.0" y="544.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">temperature=0.2, stream=True</text>
<text x="538.0" y="568.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Tokens stream to the client as Server-Sent</text>
<text x="538.0" y="588.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Events, then the citations [1]–[5] follow</text>
<text x="538.0" y="607.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">(metadata + a 200-character preview).</text>
<text x="40.0" y="648.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Each request is logged to the traces collection: retrieved + selected ids, tokens in/out, latencies.</text>
<text x="40.0" y="672.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Chapters 3–9 of this post. Funnel widths are not to scale.</text>
</svg>