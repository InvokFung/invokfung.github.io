<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 788" width="1000" height="788" role="img" aria-label="Three writes on the same user document: updateOne with $set changes only named fields, replaceOne swaps the whole document except _id, and an upsert inserts a new document when nothing matches">
