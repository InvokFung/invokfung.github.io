<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 652" width="1000" height="652" role="img" aria-label="Lifecycle of the bank-transfer transaction: session, withTransaction, three writes, commit, abort and retry">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="652" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="650.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">A transaction, step by step</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The bank transfer from Chapter 9: all three writes commit together, or none of them do.</text>
<rect x="40.0" y="100.0" width="920.0" height="440.0" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="60.0" y="128.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">const session = client.startSession()</text>
<text x="940.0" y="522.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="end">finally { await session.endSession() }</text>
<rect x="60.0" y="144.0" width="880.0" height="356.0" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="80.0" y="174.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start">await session.withTransaction(async () =&gt; { … })</text>
<rect x="819.0" y="159.5" width="101.0" height="23.5" rx="11.75" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
<text x="869.5" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">primary only</text>
<rect x="695.5" y="159.5" width="115.5" height="23.5" rx="11.75" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
<text x="753.2" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">majority write</text>
<rect x="579.2" y="159.5" width="108.2" height="23.5" rx="11.75" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
<text x="633.4" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">snapshot read</text>
<rect x="85.0" y="250.0" width="250.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="107.0" cy="272.0" r="12" fill="#2563eb"/>
<text x="107.0" y="277.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="127.0" y="278.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="start">Debit A</text>
<text x="99.0" y="306.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">{ _id: fromId,</text>
<text x="113.3" y="325.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">balance: { $gte: amount } }</text>
<text x="99.0" y="344.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">$inc: { balance: -amount }</text>
<rect x="375.0" y="250.0" width="250.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="397.0" cy="272.0" r="12" fill="#2563eb"/>
<text x="397.0" y="277.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="417.0" y="278.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="start">Credit B</text>
<text x="389.0" y="306.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">{ _id: toId }</text>
<text x="389.0" y="325.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">$inc: { balance: amount }</text>
<line x1="339.0" y1="302.0" x2="369.0" y2="302.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="665.0" y="250.0" width="250.0" height="104.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="687.0" cy="272.0" r="12" fill="#2563eb"/>
<text x="687.0" y="277.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="707.0" y="278.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="start">Record the transfer</text>
<text x="679.0" y="306.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">transfers.insertOne({</text>
<text x="693.3" y="325.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">from, to, amount, at })</text>
<line x1="629.0" y1="302.0" x2="659.0" y2="302.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="66.0" y1="302.0" x2="79.0" y2="302.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M895.0,246.0 L895.0,224.0 Q895.0,214.0 885.0,214.0 L115.0,214.0 Q105.0,214.0 105.0,224.0 L105.0,244.0" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ahA)"/>
<defs><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker></defs>
<rect x="169.6" y="201.0" width="660.8" height="26.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="500.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="middle">Transient error (failover, lock conflict, network blip): withTransaction retries automatically</text>
<defs><marker id="ahC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc4c3a"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker></defs>
<line x1="210.0" y1="358.0" x2="210.0" y2="396.0" stroke="#dc4c3a" stroke-width="2" marker-end="url(#ahC)"/>
<text x="220.0" y="382.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="start">matchedCount === 0</text>
<rect x="85.0" y="400.0" width="250.0" height="82.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<text x="101.0" y="427.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#dc4c3a" text-anchor="start">Abort</text>
<text x="101.0" y="450.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">throw 'insufficient funds'</text>
<text x="101.0" y="470.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">no write from this attempt is kept</text>
<line x1="790.0" y1="358.0" x2="790.0" y2="396.0" stroke="#16a34a" stroke-width="2" marker-end="url(#ahG)"/>
<text x="800.0" y="382.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#16a34a" text-anchor="start">callback returns</text>
<rect x="665.0" y="400.0" width="250.0" height="82.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="681.0" y="427.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#16a34a" text-anchor="start">Commit</text>
<text x="681.0" y="450.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">all three writes, together</text>
<text x="681.0" y="470.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">write concern: majority</text>
<text x="500.0" y="424.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Pass { session } to every op.</text>
<text x="500.0" y="446.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">Forget it and that op runs</text>
<text x="500.0" y="466.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">outside the transaction.</text>
<text x="40.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">LIFETIME</text>
<text x="40.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">60 s</text>
<text x="240.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">OPLOG PER TRANSACTION</text>
<text x="240.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">16 MB</text>
<text x="440.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">READS</text>
<text x="440.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">primary only</text>
<text x="630.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">RULE OF THUMB</text>
<text x="630.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">under 100 ms is usually fine</text>
<line x1="40.0" y1="546.0" x2="960.0" y2="546.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="634.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: this post, Chapters 2–5 and 9. Limits are the server defaults listed in the post.</text>
</svg>