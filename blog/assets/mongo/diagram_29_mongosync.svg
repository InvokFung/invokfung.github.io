<text x="855.0" y="490.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="middle">writes frozen: seconds</text>
<text x="40.0" y="522.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">ACTIVE-PASSIVE ACROSS REGIONS — ON A REGION A OUTAGE</text>
<rect x="40.0" y="534.0" width="296.0" height="70.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="66.0" cy="569.0" r="12" fill="#d97706"/>
<text x="66.0" y="574.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="88.0" y="564.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Stop the mongosync direction</text>
<text x="88.0" y="584.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">(or accept its catch-up lag).</text>
<rect x="352.0" y="534.0" width="296.0" height="70.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="378.0" cy="569.0" r="12" fill="#d97706"/>
<text x="378.0" y="574.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="400.0" y="564.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Point the app's connection</text>
<text x="400.0" y="584.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">string / DNS at cluster B.</text>
<rect x="664.0" y="534.0" width="296.0" height="70.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="690.0" cy="569.0" r="12" fill="#d97706"/>
<text x="690.0" y="574.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="712.0" y="564.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Optional: start reverse mongosync</text>
<text x="712.0" y="584.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">(B → A) for when A recovers.</text>
<text x="40.0" y="630.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#dc4c3a" text-anchor="start">Active-active (writes in both regions) is not natively supported: shard by region instead.</text>
<text x="40.0" y="662.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: the post, Part 2 (Chapters 7 and 8). Phase widths are not to scale.</text>
</svg>