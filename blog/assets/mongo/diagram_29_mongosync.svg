<text x="86.0" y="260.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">Initial sync</text>
<text x="56.0" y="288.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Bulk copy of every</text>
<text x="56.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">document.</text>
<rect x="52.0" y="340.0" width="256.0" height="26.0" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
<text x="62.0" y="358.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">POST /api/v1/start</text>
<rect x="340.0" y="222.0" width="300.0" height="156.0" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
<rect x="340" y="222" width="300" height="6" rx="3" fill="#7c3aed"/>
<circle cx="366.0" cy="254.0" r="12" fill="#7c3aed"/>
<text x="366.0" y="259.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="386.0" y="260.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start">Steady state</text>
<text x="356.0" y="288.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Follows the source oplog</text>
<text x="356.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">without a break, so the</text>
<text x="356.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">destination stays current.</text>
<rect x="352.0" y="340.0" width="276.0" height="26.0" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
<text x="362.0" y="358.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">GET /api/v1/progress</text>
<rect x="660.0" y="222.0" width="300.0" height="156.0" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="660" y="222" width="300" height="6" rx="3" fill="#2563eb"/>
<circle cx="686.0" cy="254.0" r="12" fill="#2563eb"/>
<text x="686.0" y="259.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="706.0" y="260.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">Commit</text>
<text x="676.0" y="288.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Drains the rest of the oplog,</text>
<text x="676.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">freezes writes briefly, then the</text>
<text x="676.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">destination is in charge.</text>
<rect x="672.0" y="340.0" width="276.0" height="26.0" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1"/>
<text x="682.0" y="358.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">POST /api/v1/commit</text>
