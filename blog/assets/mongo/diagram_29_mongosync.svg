<text x="500.0" y="143.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">mongosync</text>
<text x="500.0" y="167.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">REST API on localhost:27182</text>
