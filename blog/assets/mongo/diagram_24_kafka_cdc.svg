<rect x="40.0" y="552.0" width="296.0" height="104.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
<text x="56.0" y="578.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">Order per document</text>
<text x="56.0" y="602.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Key = _id (Mongo) or primary key</text>
<text x="56.0" y="621.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">(Postgres). Same key, same partition,</text>
<text x="56.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">so one document's events stay in order.</text>
<rect x="352.0" y="552.0" width="296.0" height="104.0" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="368.0" y="578.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">At-least-once delivery</text>
<text x="368.0" y="602.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Kafka can deliver an event twice.</text>
<text x="368.0" y="621.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Sinks upsert by business key,</text>
<text x="368.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">so a replay is safe.</text>
<rect x="664.0" y="552.0" width="296.0" height="104.0" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
<text x="680.0" y="578.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="start">Postgres → MongoDB</text>
<text x="680.0" y="602.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Prefer the Debezium MongoDB sink.</text>
<text x="680.0" y="621.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The older MongoDB Kafka Sink needs a</text>
<text x="680.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">CDC handler for Debezium updates.</text>
<text x="40.0" y="682.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: the post's connector configs (Chapters 3, 4, 6) and ordering rules (Chapters 7, 9).</text>
