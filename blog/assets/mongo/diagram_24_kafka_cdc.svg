<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Kafka Connect architecture: MongoDB source and sink connectors, and Debezium Postgres to MongoDB, around one Kafka cluster">
