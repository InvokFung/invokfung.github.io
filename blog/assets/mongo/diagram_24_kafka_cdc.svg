<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Three connectors, two directions, one Kafka cluster</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Top: MongoDB → Kafka → MongoDB with the official connectors. Bottom: Postgres → Kafka → MongoDB with Debezium.</text>
