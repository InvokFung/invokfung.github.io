<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="E-commerce schema map: users with an embedded address book, orders with embedded items that reference products and copy a product snapshot, products referencing a category tree, reviews referencing products, plus carts and an audit log in their own collections">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="720" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="718.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">An e-commerce schema: what to embed, what to reference</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Data read together lives together. Shared, unbounded or independently read data gets its own collection.</text>
<defs><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker></defs>
<rect x="40.0" y="108.0" width="262.0" height="196.0" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="56.0" y="136.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Users</text>
<text x="111.0" y="136.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">own collection</text>
<text x="56.0" y="164.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">_id</text>
<text x="56.0" y="186.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">name</text>
<rect x="52.0" y="200.0" width="238.0" height="90.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
