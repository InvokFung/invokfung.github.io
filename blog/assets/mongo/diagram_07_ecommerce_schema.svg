<text x="358.0" y="268.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start">items</text>
<text x="402.0" y="268.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">embedded, bounded (≤ ~50)</text>
<rect x="356.0" y="282.0" width="252.0" height="36.0" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2"/>
<text x="368.0" y="305.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">qty</text>
