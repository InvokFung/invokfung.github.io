<text x="66.0" y="246.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">embedded, bounded (≤ ~5)</text>
<text x="66.0" y="266.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">always read with the user</text>
<rect x="40.0" y="326.0" width="262.0" height="92.0" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="56.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Carts</text>
<text x="111.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">own collection</text>
<text x="56.0" y="380.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Live, may be huge for window</text>
<text x="56.0" y="399.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">shoppers. Or embed in the user if small.</text>
<rect x="40.0" y="440.0" width="262.0" height="92.0" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="56.0" y="468.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Audit log</text>
<text x="148.6" y="468.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">own collection</text>
<text x="56.0" y="494.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">High volume, time-bounded:</text>
<text x="56.0" y="513.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">a TTL index deletes old entries.</text>
<rect x="332.0" y="108.0" width="300.0" height="300.0" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="348.0" y="136.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Orders</text>
<text x="412.4" y="136.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">own collection</text>
<text x="348.0" y="164.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">_id</text>
<text x="348.0" y="188.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start">user_id</text>
<text x="422.8" y="188.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">reference to a user</text>
