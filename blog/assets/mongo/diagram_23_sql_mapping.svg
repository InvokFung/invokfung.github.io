<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="Worked mapping: four joined Postgres tables become one denormalised MongoDB orders document; users and products stay as their own collections">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="660" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="658.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">From 4 joined tables to 1 order document</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Postgres joins these 4 tables for every order detail query. MongoDB keeps one denormalised orders document.</text>
<defs><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0d9488"/></marker></defs>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker></defs>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker></defs>
<defs><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker></defs>
<text x="40.0" y="112.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">POSTGRES — 4 TABLES</text>
<text x="540.0" y="112.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">MONGODB — 3 COLLECTIONS, ORDERS DENORMALISED</text>
<rect x="40.0" y="128.0" width="330.0" height="62.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="56.0" y="153.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="start">orders</text>
<text x="56.0" y="178.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">id, user_id, status, total, created_at</text>
<rect x="40.0" y="222.0" width="330.0" height="82.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="56.0" y="247.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15.5" font-weight="700" fill="#d97706" text-anchor="start">order_items</text>
<text x="56.0" y="272.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">id, order_id, product_id,</text>
<text x="56.0" y="292.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">quantity, unit_price</text>
<rect x="40.0" y="392.0" width="330.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="56.0" y="417.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="start">products</text>
<text x="56.0" y="442.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">id, name, sku, price</text>
<rect x="40.0" y="478.0" width="330.0" height="62.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="56.0" y="503.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="start">users</text>
<text x="56.0" y="528.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">id, name, email</text>
<rect x="540.0" y="128.0" width="392.0" height="212.0" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="558.0" y="160.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">orders {</text>
<rect x="548" y="167" width="376" height="21" rx="4" fill="#f0fdfa"/>
<text x="576.0" y="183.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">_id, user_id,</text>
<rect x="548" y="190" width="376" height="21" rx="4" fill="#f5f3ff"/>
<text x="576.0" y="206.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start"><tspan fill="#7c3aed" font-weight="700">user_email_at_order</tspan>,</text>
<rect x="548" y="213" width="376" height="21" rx="4" fill="#f0fdfa"/>
<text x="576.0" y="229.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">status, total, created_at,</text>
<rect x="548" y="236" width="376" height="21" rx="4" fill="#fffbeb"/>
<text x="576.0" y="252.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">items: [</text>
<rect x="548" y="259" width="376" height="21" rx="4" fill="#fffbeb"/>
<text x="594.0" y="275.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">{ p, <tspan fill="#2563eb" font-weight="700">name_at_order, price_at_order</tspan>, qty }</text>
<rect x="548" y="282" width="376" height="21" rx="4" fill="#fffbeb"/>
<text x="576.0" y="298.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">]</text>
<text x="558.0" y="321.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">}</text>
<rect x="540.0" y="392.0" width="392.0" height="62.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="556.0" y="419.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">products { _id, name, sku, price }</text>
<text x="556.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">name + price copied into each item</text>
<rect x="540.0" y="478.0" width="392.0" height="62.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="556.0" y="505.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">users { _id, name, email }</text>
<text x="556.0" y="528.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">email copied into the order</text>
<path d="M378,159.0 C455.0,159.0 455.0,178.0 532,178.0" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mt)"/>
<text x="455.0" y="147.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d9488" text-anchor="middle">1 row → 1 document</text>
<path d="M378,263.0 C455.0,263.0 455.0,270.0 532,270.0" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ma)"/>
<text x="455.0" y="293.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="middle">child rows →</text>
<text x="455.0" y="311.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="middle">embedded array</text>
<path d="M378,423.0 L532,423.0" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mb)"/>
<text x="455.0" y="413.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">stays its own collection</text>
<path d="M378,509.0 L532,509.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mv)"/>
<text x="455.0" y="499.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">stays its own collection</text>
<path d="M932,423.0 L954,423.0 L954,270.0 L926,270.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#mb)"/>
<path d="M932,509.0 L972,509.0 L972,201.0 L926,201.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#mv)"/>
<text x="742.6" y="206.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#7c3aed" text-anchor="start" font-style="italic">extended reference</text>
<rect x="40.0" y="570.0" width="920.0" height="50.0" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="601.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2937" text-anchor="start">Trade-off: the join goes away, and a later product name change does not rewrite past orders (usually correct).</text>
<text x="40.0" y="642.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: the post's worked mapping (Chapter 2). A few cross-order reports use $lookup and run nightly via $merge.</text>
</svg>