<text x="598.0" y="324.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="start">lag</text>
<circle cx="614.0" cy="196.0" r="12" fill="#d97706"/>
<text x="614.0" y="201.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="662.0" cy="141.0" r="12" fill="#d97706"/>
<text x="662.0" y="146.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="684.0" y="146.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">The app writes to the PRIMARY.</text>
<circle cx="662.0" cy="173.0" r="12" fill="#d97706"/>
<text x="662.0" y="178.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="684.0" y="178.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">The PRIMARY records the write in its</text>
<text x="684.0" y="198.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">oplog (local.oplog.rs) and applies it.</text>
<circle cx="662.0" cy="225.0" r="12" fill="#d97706"/>
<text x="662.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="684.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Each SECONDARY tails that oplog and</text>
<text x="684.0" y="250.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">applies the entries in order.</text>
<circle cx="662.0" cy="277.0" r="12" fill="#d97706"/>
<text x="662.0" y="282.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="684.0" y="282.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">2 of 3 voters hold the new entry: a</text>
<text x="684.0" y="302.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">majority, so it is majority committed.</text>
<text x="684.0" y="336.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#dc4c3a" text-anchor="start">B is one entry behind: that gap is</text>
<text x="684.0" y="356.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#dc4c3a" text-anchor="start">replication lag.</text>
<rect x="165.0" y="322.0" width="14.0" height="14.0" rx="3" fill="#0d9488" stroke="#0d9488" stroke-width="1"/>
<text x="185.0" y="334.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">newest write</text>
<rect x="165" y="344" width="14" height="14" rx="3" fill="#fff" stroke="#dc4c3a" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="185.0" y="356.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">not copied yet</text>
<line x1="40.0" y1="384.0" x2="960.0" y2="384.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">2 · Failover: the members elect a new primary</text>
<text x="40.0" y="448.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc4c3a" text-anchor="start">Primary stops answering</text>
<rect x="132.0" y="464.0" width="108" height="36" rx="8" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="186.0" y="487.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">PRIMARY</text>
