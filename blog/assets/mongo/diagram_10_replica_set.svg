<text x="80.0" y="240.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">App</text>
<text x="80.0" y="260.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">driver</text>
<rect x="165.0" y="200.0" width="180.0" height="88.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
