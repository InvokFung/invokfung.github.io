<rect x="274.0" y="242.0" width="28.0" height="28.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="307.0" y="242.0" width="28.0" height="28.0" rx="4" fill="#0d9488" stroke="#0d9488" stroke-width="1.2"/>
