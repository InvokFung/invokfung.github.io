<rect x="664.0" y="542.0" width="108.0" height="36.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="718.0" y="565.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">PRIMARY</text>
<rect x="840.0" y="542.0" width="108.0" height="36.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="894.0" y="565.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">SECONDARY</text>
<line x1="686.0" y1="512.0" x2="706.0" y2="538.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="664.0" y="504.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">writes</text>
<text x="660.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Drivers see the change via heartbeats;</text>
<text x="660.0" y="643.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">writes go to the new primary. Typical</text>
<text x="660.0" y="662.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">failover: 10–20 s.</text>
<text x="40.0" y="694.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: this post, Chapters 5–8 and 11. Protocol Version 1 (PV1), 3 data-bearing voters, w: "majority". Retryable writes hide most of the pause.</text>
</svg>