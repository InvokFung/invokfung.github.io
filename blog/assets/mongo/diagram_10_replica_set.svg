<rect x="354.0" y="542.0" width="108.0" height="36.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="408.0" y="565.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">CANDIDATE</text>
<rect x="530.0" y="542.0" width="108.0" height="36.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="584.0" y="565.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">SECONDARY</text>
<line x1="526.0" y1="560.0" x2="468.0" y2="560.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="496.0" y="534.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">vote yes</text>
<text x="350.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The others vote yes if the candidate's</text>
<text x="350.0" y="643.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">oplog is up to date enough.</text>
<text x="350.0" y="662.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">2 of 3 votes = a majority.</text>
<line x1="644.0" y1="522.0" x2="660.0" y2="522.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
