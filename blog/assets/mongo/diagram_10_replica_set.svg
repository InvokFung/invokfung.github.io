<text x="422.0" y="288.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">SECONDARY B</text>
<text x="578.0" y="288.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="end">oplog</text>
<rect x="420.0" y="304.0" width="28.0" height="28.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
