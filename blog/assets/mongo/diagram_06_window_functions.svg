<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" width="1000" height="712" role="img" aria-label="Window functions with $setWindowFields: every sales row is kept and gets a running total and a 3-row moving average computed within its region; $group would collapse the rows to one per region">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="712" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="710.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Window functions keep every row</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">$setWindowFields adds values computed over nearby rows of the same partition. $group collapses them.</text>
<rect x="40.0" y="100.0" width="920.0" height="153.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="56.0" y="124.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start">{ $setWindowFields: {</text>
<text x="85.0" y="143.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start">partitionBy: "$region",                     // separate window per region</text>
<text x="85.0" y="162.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start">sortBy: { day: 1 },</text>
<text x="85.0" y="181.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start">output: {</text>
<text x="99.5" y="200.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="start">running_total: { $sum: "$revenue", window: { documents: ["unbounded", "current"] } },</text>
<text x="99.5" y="219.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#fcd34d" text-anchor="start">moving_avg_3d: { $avg: "$revenue", window: { documents: [-2, 0] } },</text>
<text x="99.5" y="238.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">...</text>
<text x="56.0" y="309.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">day</text>
<text x="180.0" y="309.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">region</text>
<text x="310.0" y="309.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#6b7280" text-anchor="end">revenue</text>
<text x="450.0" y="309.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#0d9488" text-anchor="end">running_total</text>
<text x="584.0" y="309.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#d97706" text-anchor="end">moving_avg_3d</text>
<text x="56.0" y="287.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Output: all 5 rows are kept</text>
<rect x="40.0" y="321.0" width="560.0" height="104.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="612.0" y="371.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">partition</text>
