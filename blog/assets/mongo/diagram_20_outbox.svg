<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-label="Outbox pattern: order and event saved in one transaction, a change-stream publisher sends to Kafka, and an idempotent consumer skips duplicates">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="650" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="648.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">The outbox pattern, end to end</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Save the event in the same transaction as the order, publish it later, and let the consumer skip duplicates.</text>
<rect x="40.0" y="96.0" width="920.0" height="52.0" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="58.0" y="127.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#dc4c3a" text-anchor="start">Without an outbox</text>
<circle cx="215" cy="122" r="8" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M212.0,119.0 L218.0,125.0 M218.0,119.0 L212.0,125.0" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="229.0" y="127.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">DB insert ok, Kafka publish fails → lost event</text>
<circle cx="560" cy="122" r="8" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M557.0,119.0 L563.0,125.0 M563.0,119.0 L557.0,125.0" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="574.0" y="127.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Kafka publish ok, DB insert fails → phantom event</text>
<rect x="40.0" y="172.0" width="250.0" height="294.0" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="56.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0d9488" text-anchor="start">1 · Service</text>
<text x="56.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">one MongoDB transaction</text>
<rect x="54.0" y="242.0" width="222.0" height="118.0" rx="8" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="54" y="242" width="222" height="118" rx="8" fill="none" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="68.0" y="268.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">orders.insertOne(order)</text>
<text x="68.0" y="294.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">outbox.insertOne(event)</text>
<text x="82.0" y="314.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">published_at: null</text>
<text x="82.0" y="332.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">attempts: 0</text>
<text x="82.0" y="350.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">aggregate_id: order id</text>
<text x="56.0" y="388.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Commit: both writes</text>
<text x="56.0" y="407.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">happen, or neither does.</text>
<text x="56.0" y="436.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Business state and event</text>
<text x="56.0" y="454.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">always stay consistent.</text>
<rect x="320.0" y="172.0" width="250.0" height="294.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="336.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#2563eb" text-anchor="start">2 · Publisher</text>
<text x="336.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">tails the outbox with a change stream</text>
<circle cx="348.0" cy="255.0" r="12" fill="#2563eb"/>
<text x="348.0" y="260.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="368.0" y="260.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Watch inserts on</text>
<text x="368.0" y="279.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">outbox</text>
<circle cx="348.0" cy="305.0" r="12" fill="#2563eb"/>
<text x="348.0" y="310.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="368.0" y="310.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Send to Kafka,</text>
<text x="368.0" y="329.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">key = aggregate_id</text>
<circle cx="348.0" cy="355.0" r="12" fill="#2563eb"/>
<text x="348.0" y="360.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="368.0" y="360.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Set published_at</text>
<circle cx="348.0" cy="393.0" r="12" fill="#2563eb"/>
<text x="348.0" y="398.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="368.0" y="398.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Save the resume token,</text>
<text x="368.0" y="417.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">only after success</text>
<text x="336.0" y="448.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start">Delivery: at least once</text>
<rect x="600.0" y="172.0" width="150.0" height="294.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="616.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#7c3aed" text-anchor="start">3 · Kafka</text>
<text x="616.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">topic = event_type</text>
<text x="616.0" y="266.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">P0</text>
<rect x="640.0" y="250.0" width="94.0" height="24.0" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
<rect x="648.0" y="254.0" width="20.0" height="16.0" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="674.0" y="254.0" width="20.0" height="16.0" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
<text x="616.0" y="300.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">P1</text>
<rect x="640.0" y="284.0" width="94.0" height="24.0" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
<rect x="648.0" y="288.0" width="20.0" height="16.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="658.0" y="300.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="674.0" y="288.0" width="20.0" height="16.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="684.0" y="300.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="700.0" y="288.0" width="20.0" height="16.0" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="710.0" y="300.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="616.0" y="334.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">P2</text>
<rect x="640.0" y="318.0" width="94.0" height="24.0" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
<rect x="648.0" y="322.0" width="20.0" height="16.0" rx="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
<text x="616.0" y="378.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Same aggregate_id</text>
<text x="616.0" y="397.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">→ same partition</text>
<text x="616.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">→ kept in order</text>
<text x="616.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">(P1: one order's</text>
<text x="616.0" y="459.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">events 1, 2, 3)</text>
<rect x="780.0" y="172.0" width="180.0" height="294.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="796.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#d97706" text-anchor="start">4 · Consumer</text>
<text x="796.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">must be idempotent</text>
<text x="796.0" y="258.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Upsert event._id into</text>
<text x="796.0" y="278.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">consumed_events</text>
<circle cx="806" cy="316" r="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M802.0,316.0 l2.9,2.9 l5.2,-5.6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="822.0" y="321.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">New → applyEvent()</text>
<circle cx="806" cy="352" r="9" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M802.6,348.6 L809.4,355.4 M809.4,348.6 L802.6,355.4" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="822.0" y="357.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Seen before → skip</text>
<text x="796.0" y="396.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Also good: idempotent</text>
<text x="796.0" y="414.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">operations (upsert by</text>
<text x="796.0" y="432.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">key, set status to X)</text>
<line x1="294.0" y1="300.0" x2="316.0" y2="300.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="574.0" y1="300.0" x2="596.0" y2="300.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="754.0" y1="300.0" x2="776.0" y2="300.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="40.0" y="486.0" width="920.0" height="118.0" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="58.0" y="514.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc4c3a" text-anchor="start">When publishing fails</text>
<circle cx="64" cy="537.5" r="2.8" fill="#dc4c3a"/>
<text x="76.0" y="542.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">$inc attempts</text>
<text x="182.4" y="542.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">and back off. The resume token is not saved, so the event comes again after a restart.</text>
<circle cx="64" cy="559.5" r="2.8" fill="#dc4c3a"/>
<text x="76.0" y="564.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">attempts &gt; 10</text>
<text x="178.4" y="564.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">: copy to outbox_dlq, delete it from outbox, and alert. Never drop events silently.</text>
<circle cx="64" cy="581.5" r="2.8" fill="#dc4c3a"/>
<text x="76.0" y="586.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">TTL</text>
<text x="104.4" y="586.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">only on published events (published_at not null). Never TTL the unpublished ones.</text>
<text x="40.0" y="632.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Chapters 1, 3, 4, 6, 7 and 8 of this post.</text>
</svg>