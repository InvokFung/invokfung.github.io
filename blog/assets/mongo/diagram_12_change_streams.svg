<path d="M273.0,412 L273.0,404 L911.0,404 L911.0,412" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="592.0" y="396.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="middle">oplog window: a capped collection, so the oldest entries drop off</text>
