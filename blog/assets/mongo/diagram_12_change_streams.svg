<text x="549.0" y="524.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="start">On restart: watch([], { resumeAfter: lastToken })</text>
<text x="549.0" y="544.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">sends every event after the saved token.</text>
<rect x="40.0" y="574.0" width="452.0" height="88.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
<rect x="56.0" y="588.0" width="14.0" height="14.0" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/>
<text x="78.0" y="600.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Applied, but its token was not saved</text>
<text x="56.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">On restart it is applied again (double count).</text>
<text x="56.0" y="646.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Fix: idempotent updates or a transactional consumer.</text>
<rect x="508.0" y="574.0" width="452.0" height="88.0" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
<text x="524.0" y="600.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="start">Down longer than the oplog window?</text>
<text x="524.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The saved token has expired, so resume fails.</text>
<text x="524.0" y="646.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Fix: re-sync from scratch.</text>
