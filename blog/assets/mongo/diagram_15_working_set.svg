<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Working set versus WiredTiger cache: when it fits reads stay fast, when it does not the cache thrashes">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="640" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="638.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Does the working set fit in the cache?</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Working set = the data + indexes you touch often. For read-heavy loads it should fit in the WiredTiger cache.</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#fca5a5" stroke-width="3"/></pattern></defs>
<rect x="40.0" y="100.0" width="920.0" height="44.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="58.0" y="127.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="start">Rough estimate</text>
<text x="186.0" y="127.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">working_set ≈ (active indexes' size) + (5-10% of frequently-accessed docs' size)</text>
<text x="150.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">WiredTiger cache</text>
<text x="286.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">default size = max(50% of RAM − 1 GB, 256 MB)</text>
<circle cx="58.0" cy="225.0" r="12" fill="#0d9488"/>
<text x="58.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<text x="80.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">Fits</text>
<rect x="150.0" y="200.0" width="180.0" height="50.0" rx="6" fill="#99f6e4" stroke="#0d9488" stroke-width="1.2"/>
<text x="240.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d9488" text-anchor="middle">active indexes</text>
<rect x="330.0" y="200.0" width="120.0" height="50.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="390.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">hot docs</text>
<text x="520.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#9ca3af" text-anchor="middle">headroom</text>
<rect x="144.0" y="194.0" width="452.0" height="62.0" rx="10" fill="none" stroke="#1f2937" stroke-width="2"/>
<circle cx="58.0" cy="345.0" r="12" fill="#dc4c3a"/>
<text x="58.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<text x="80.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc4c3a" text-anchor="start">Too big</text>
<rect x="150.0" y="320.0" width="250.0" height="50.0" rx="6" fill="#99f6e4" stroke="#0d9488" stroke-width="1.2"/>
<text x="275.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d9488" text-anchor="middle">active indexes</text>
<rect x="400.0" y="320.0" width="270.0" height="50.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
<text x="535.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">hot docs</text>
<rect x="596.0" y="320.0" width="74.0" height="50.0" rx="6" fill="url(#hatch)" stroke="#dc4c3a" stroke-width="1.2"/>
<rect x="144.0" y="314.0" width="452.0" height="62.0" rx="10" fill="none" stroke="#1f2937" stroke-width="2"/>
<text x="633.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="middle">no room</text>
<line x1="596.0" y1="186.0" x2="596.0" y2="384.0" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="604.0" y="290.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">cache limit</text>
<text x="150.0" y="404.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Pages that do not fit are read from disk:</text>
<text x="150.0" y="424.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">milliseconds on SSD, tens of ms on a slow disk.</text>
<rect x="710.0" y="188.0" width="250.0" height="74.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="726.0" y="214.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="start">Reads hit the cache</text>
<text x="726.0" y="238.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">An index page already in</text>
<text x="726.0" y="256.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">cache takes microseconds.</text>
<rect x="710.0" y="298.0" width="250.0" height="128.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<text x="726.0" y="324.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#dc4c3a" text-anchor="start">Cache thrashes</text>
<text x="726.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Every query causes evictions.</text>
<text x="726.0" y="374.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Queries that should be &lt; 1 ms</text>
<text x="726.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">become 10–50 ms.</text>
<text x="726.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Latency p99 spikes.</text>
<rect x="40.0" y="452.0" width="920.0" height="40.0" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="58.0" y="477.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="start">Warning sign:</text>
<text x="160.0" y="477.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">pages evicted by application threads</text>
<text x="460.0" y="477.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">climbing fast in db.serverStatus().wiredTiger.cache</text>
<text x="40.0" y="526.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Fix priority when it does not fit</text>
<text x="292.0" y="526.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">(first → last)</text>
<rect x="40.0" y="540.0" width="164.0" height="56.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="62.0" cy="568.0" r="12" fill="#0d9488"/>
<text x="62.0" y="573.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82.0" y="563.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Drop unused</text>
<text x="82.0" y="582.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">indexes</text>
<line x1="208.0" y1="568.0" x2="225.0" y2="568.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="229.0" y="540.0" width="164.0" height="56.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="251.0" cy="568.0" r="12" fill="#0d9488"/>
<text x="251.0" y="573.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="271.0" y="563.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Reduce</text>
<text x="271.0" y="582.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">document size</text>
<line x1="397.0" y1="568.0" x2="414.0" y2="568.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="418.0" y="540.0" width="164.0" height="56.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="440.0" cy="568.0" r="12" fill="#0d9488"/>
<text x="440.0" y="573.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="460.0" y="563.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Archive</text>
<text x="460.0" y="582.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">old data</text>
<line x1="586.0" y1="568.0" x2="603.0" y2="568.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="607.0" y="540.0" width="164.0" height="56.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="629.0" cy="568.0" r="12" fill="#0d9488"/>
<text x="629.0" y="573.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="649.0" y="563.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Scale up to a</text>
<text x="649.0" y="582.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">bigger RAM tier</text>
<line x1="775.0" y1="568.0" x2="792.0" y2="568.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="796.0" y="540.0" width="164.0" height="56.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="818.0" cy="568.0" r="12" fill="#6b7280"/>
<text x="818.0" y="573.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="838.0" y="563.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Last resort: shard</text>
<text x="838.0" y="582.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">(Post 11)</text>
<text x="40.0" y="622.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Chapters 1–2 of this post. Bar lengths are illustrative, not measured.</text>
</svg>