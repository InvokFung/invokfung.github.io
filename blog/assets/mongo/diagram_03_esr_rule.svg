<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="The ESR rule for compound indexes: equality fields first, then the sort field, then range; index keys are stored sorted so the matching entries form one run already in date order">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="660" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="658.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Compound index order: the ESR rule</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Equality fields first, then Sort, then Range. The index stores its keys sorted in exactly that field order.</text>
<circle cx="52" cy="116" r="12" fill="#1f2937"/>
<text x="52.0" y="121.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="74.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Match the query to the index</text>
<rect x="40.0" y="140.0" width="430.0" height="70.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="56" y="168" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#e2e8f0">db.orders.find({ <tspan fill="#5eead4" font-weight="700">user_id: 1</tspan>, <tspan fill="#5eead4" font-weight="700">status: "paid"</tspan> })</text>
<text x="71.7" y="192" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#e2e8f0">.sort({ <tspan fill="#fcd34d" font-weight="700">at: -1</tspan> })</text>
<text x="40.0" y="246.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="start">Best index</text>
<rect x="40.0" y="258.0" width="134.0" height="42.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="107.0" y="285.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">user_id: 1</text>
<circle cx="60" cy="326" r="12" fill="#0d9488"/>
<text x="60.0" y="331.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
<text x="78.0" y="331.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Equality</text>
<rect x="188.0" y="258.0" width="134.0" height="42.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="255.0" y="285.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">status: 1</text>
<circle cx="208" cy="326" r="12" fill="#0d9488"/>
<text x="208.0" y="331.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
<text x="226.0" y="331.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Equality</text>
<rect x="336.0" y="258.0" width="134.0" height="42.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="403.0" y="285.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">at: -1</text>
<circle cx="356" cy="326" r="12" fill="#d97706"/>
<text x="356.0" y="331.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
<text x="374.0" y="331.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">Sort, then Range</text>
<text x="40.0" y="372.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start">E</text>
<text x="60.0" y="372.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Equality fields first: exact matches narrow the key range.</text>
<text x="40.0" y="394.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="start">S</text>
<text x="60.0" y="394.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Sort field next: keys come out already in order.</text>
<text x="40.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="start">R</text>
<text x="60.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Range field last: one contiguous slice of what is left.</text>
<circle cx="512" cy="116" r="12" fill="#1f2937"/>
<text x="512.0" y="121.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="534.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">The index keeps its keys sorted</text>
<text x="534.0" y="144.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">by user_id, then status, then at (newest first)</text>
<text x="514.0" y="182.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">user_id</text>
<text x="584.0" y="182.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">status</text>
<text x="670.0" y="182.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">at</text>
<line x1="500.0" y1="192.0" x2="762.0" y2="192.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
<rect x="500.0" y="196.0" width="262.0" height="26.0" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
<text x="514.0" y="214.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">1</text>
<text x="584.0" y="214.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">"paid"</text>
<text x="670.0" y="214.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">2026-05-24</text>
<rect x="500.0" y="226.0" width="262.0" height="26.0" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
<text x="514.0" y="244.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">1</text>
<text x="584.0" y="244.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">"paid"</text>
<text x="670.0" y="244.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">2026-05-21</text>
<rect x="500.0" y="256.0" width="262.0" height="26.0" rx="6" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
<text x="514.0" y="274.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">1</text>
<text x="584.0" y="274.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">"paid"</text>
<text x="670.0" y="274.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">2026-05-20</text>
<rect x="500.0" y="286.0" width="262.0" height="26.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="514.0" y="304.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">1</text>
<text x="584.0" y="304.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">"shipped"</text>
<text x="670.0" y="304.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">2026-05-22</text>
<rect x="500.0" y="316.0" width="262.0" height="26.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="514.0" y="334.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">2</text>
<text x="584.0" y="334.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">"paid"</text>
<text x="670.0" y="334.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">2026-05-23</text>
<rect x="500.0" y="346.0" width="262.0" height="26.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="514.0" y="364.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">2</text>
<text x="584.0" y="364.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">"shipped"</text>
<text x="670.0" y="364.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">2026-05-19</text>
<text x="500.0" y="390.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start" font-style="italic">(example keys)</text>
<path d="M772,196 h8 V282 h-8" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="780.0" y1="239.0" x2="794.0" y2="239.0" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
<text x="802.0" y="208.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d9488" text-anchor="start">One run of keys,</text>
<text x="802.0" y="227.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0d9488" text-anchor="start">newest first.</text>
<text x="802.0" y="246.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">No extra sort step.</text>
<text x="802.0" y="265.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">A range on at</text>
<text x="802.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">(at ≥ a date) cuts</text>
<text x="802.0" y="303.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">one slice from it.</text>
<line x1="40.0" y1="464.0" x2="960.0" y2="464.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="52" cy="496" r="12" fill="#1f2937"/>
<text x="52.0" y="501.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="74.0" y="502.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Prefix rule: the same index also serves</text>
<rect x="40.0" y="522.0" width="139.1" height="36.0" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<circle cx="60" cy="540" r="8.5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M56.2,540.0 l2.7,2.7 l4.9,-5.3" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76.0" y="545.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">{ user_id }</text>
<rect x="191.1" y="522.0" width="203.9" height="36.0" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<circle cx="211.1" cy="540" r="8.5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M207.3,540.0 l2.7,2.7 l4.9,-5.3" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="227.1" y="545.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">{ user_id, status }</text>
<rect x="407.0" y="522.0" width="236.3" height="36.0" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
<circle cx="427.0" cy="540" r="8.5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M423.2,540.0 l2.7,2.7 l4.9,-5.3" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="443.0" y="545.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">{ user_id, status, at }</text>
<rect x="655.3" y="522.0" width="179.6" height="36.0" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
<circle cx="675.3" cy="540" r="8.5" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M672.1,536.8 L678.5,543.2 M678.5,536.8 L672.1,543.2" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="691.3" y="545.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">{ status } alone</text>
<text x="40.0" y="588.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">user_id is the required prefix, so the index cannot be used for status alone.</text>
<text x="40.0" y="609.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">If you often query by status alone, give it its own index. Don't make one mega-index do everything.</text>
<text x="40.0" y="642.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: MongoDB Course 03, Chapter 3. Query and index copied from the post; the key list is an example.</text>
</svg>