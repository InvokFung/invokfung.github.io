<text x="60.0" y="156.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Store each post once; build the timeline when it is read.</text>
<text x="60.0" y="186.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">WHEN AN AUTHOR POSTS</text>
<text x="60.0" y="336.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">WHEN I OPEN MY TIMELINE</text>
<rect x="510.0" y="100.0" width="450.0" height="448.0" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="530.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">B · Fan-out on write</text>
<text x="530.0" y="156.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Copy each post into every follower's inbox when it is written.</text>
<text x="530.0" y="186.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">WHEN AN AUTHOR POSTS</text>
<text x="530.0" y="336.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#9ca3af" text-anchor="start">WHEN I OPEN MY TIMELINE</text>
