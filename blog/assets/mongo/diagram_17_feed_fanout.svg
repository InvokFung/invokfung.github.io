<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Social feed: fan-out on read vs on write</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Where the work happens: when an author posts, or when a follower opens their timeline.</text>
<rect x="40.0" y="100.0" width="450.0" height="448.0" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
