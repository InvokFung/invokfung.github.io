<text x="716.0" y="539.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">a celebrity post = millions of rows</text>
<rect x="40.0" y="566.0" width="920.0" height="64.0" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
