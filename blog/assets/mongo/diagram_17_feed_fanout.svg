<text x="126.0" y="592.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">fan-out on write for normal users; fan-out on read for celebrities</text>
<text x="126.0" y="614.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">(marked with is_high_fanout: true, queried separately). Read fan-out suits small networks; write fan-out suits read-heavy feeds.</text>
<text x="40.0" y="652.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Chapter 12 of this post (Case study D: social feed). There is no one-size-fits-all answer.</text>
