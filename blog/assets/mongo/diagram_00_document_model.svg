<text x="106.0" y="136.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">database</text>
<rect x="54.0" y="152.0" width="210.0" height="196.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
