<rect x="80.0" y="210.0" width="170.0" height="96.0" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.4"/>
<rect x="74.0" y="203.0" width="170.0" height="96.0" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.4"/>
<rect x="68.0" y="196.0" width="170.0" height="96.0" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.4"/>
<text x="80.0" y="220.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">{ document }</text>
<text x="80.0" y="242.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">_id, name, email,</text>
<text x="80.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">tags, address, ...</text>
<text x="68.0" y="332.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">no enforced schema by default</text>
<rect x="54.0" y="362.0" width="210.0" height="40.0" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="68.0" y="388.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">products</text>
<text x="149.2" y="388.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">collection</text>
