<text x="756.0" y="281.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">A list inside the document.</text>
<path d="M732.0,268.0 h6 V384.0 h-6" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="738.0" y1="326.0" x2="750.0" y2="311.0" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round"/>
<text x="756.0" y="316.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0d9488" text-anchor="start">Sub-document</text>
<text x="756.0" y="335.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">A nested object. No separate</text>
<text x="756.0" y="353.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">table, no join.</text>
<path d="M732.0,388.0 h6 V414.0 h-6" fill="none" stroke="#dc4c3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="738.0" y1="401.0" x2="750.0" y2="403.0" stroke="#dc4c3a" stroke-width="1.4" stroke-linecap="round"/>
<text x="756.0" y="408.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#dc4c3a" text-anchor="start">Date</text>
<text x="756.0" y="427.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">A BSON type JSON lacks. So are</text>
<text x="756.0" y="445.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">ObjectId, Binary, Decimal128.</text>
<text x="40.0" y="510.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Coming from SQL</text>
