<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="Violin fingerboard 1st position note map">
  <rect width="700" height="360" fill="#ffffff"/>

  <!-- fingerboard rectangle -->
  <rect x="80" y="60" width="540" height="240" fill="#2a1810" stroke="#222" stroke-width="2"/>

  <!-- 4 strings -->
  <g stroke="#e8e8e0" stroke-width="2">
    <line x1="80" y1="100" x2="620" y2="100"/>
    <line x1="80" y1="160" x2="620" y2="160"/>
    <line x1="80" y1="220" x2="620" y2="220"/>
    <line x1="80" y1="280" x2="620" y2="280"/>
  </g>

  <!-- nut (left edge) -->
  <line x1="100" y1="60" x2="100" y2="300" stroke="#e8d8c0" stroke-width="6"/>

  <!-- string labels (left) -->
  <g font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="70" y="106">E</text>
    <text x="70" y="166">A</text>
    <text x="70" y="226">D</text>
    <text x="70" y="286">G</text>
  </g>

  <!-- fingers 1,2,3,4 on each string (A major / D major fingering pattern for illustration) -->
  <!-- E string: F♯(1) G♯(2) A(3) B(4) -->
  <g font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="100" r="15" fill="#ff8a65"/><text x="200" y="105" fill="#222">1</text>
    <circle cx="300" cy="100" r="15" fill="#ffd966"/><text x="300" y="105" fill="#222">2</text>
    <circle cx="400" cy="100" r="15" fill="#9be3c8"/><text x="400" y="105" fill="#222">3</text>
    <circle cx="500" cy="100" r="15" fill="#7adfd0"/><text x="500" y="105" fill="#222">4</text>
    <text x="200" y="86" fill="#fff">F♯</text>
    <text x="300" y="86" fill="#fff">G♯</text>
    <text x="400" y="86" fill="#fff">A</text>
    <text x="500" y="86" fill="#fff">B</text>
  </g>
  <!-- A string: B(1) C♯(2) D(3) E(4) -->
  <g font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="160" r="15" fill="#ff8a65"/><text x="200" y="165" fill="#222">1</text>
    <circle cx="300" cy="160" r="15" fill="#ffd966"/><text x="300" y="165" fill="#222">2</text>
    <circle cx="400" cy="160" r="15" fill="#9be3c8"/><text x="400" y="165" fill="#222">3</text>
    <circle cx="500" cy="160" r="15" fill="#7adfd0"/><text x="500" y="165" fill="#222">4</text>
    <text x="200" y="146" fill="#fff">B</text>
    <text x="300" y="146" fill="#fff">C♯</text>
    <text x="400" y="146" fill="#fff">D</text>
    <text x="500" y="146" fill="#fff">E</text>
  </g>
  <!-- D string: E(1) F♯(2) G(3) A(4) -->
  <g font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="220" r="15" fill="#ff8a65"/><text x="200" y="225" fill="#222">1</text>
    <circle cx="300" cy="220" r="15" fill="#ffd966"/><text x="300" y="225" fill="#222">2</text>
    <circle cx="400" cy="220" r="15" fill="#9be3c8"/><text x="400" y="225" fill="#222">3</text>
    <circle cx="500" cy="220" r="15" fill="#7adfd0"/><text x="500" y="225" fill="#222">4</text>
    <text x="200" y="206" fill="#fff">E</text>
    <text x="300" y="206" fill="#fff">F♯</text>
    <text x="400" y="206" fill="#fff">G</text>
    <text x="500" y="206" fill="#fff">A</text>
  </g>
  <!-- G string: A(1) B(2) C(3) D(4) -->
  <g font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="280" r="15" fill="#ff8a65"/><text x="200" y="285" fill="#222">1</text>
    <circle cx="300" cy="280" r="15" fill="#ffd966"/><text x="300" y="285" fill="#222">2</text>
    <circle cx="400" cy="280" r="15" fill="#9be3c8"/><text x="400" y="285" fill="#222">3</text>
    <circle cx="500" cy="280" r="15" fill="#7adfd0"/><text x="500" y="285" fill="#222">4</text>
    <text x="200" y="266" fill="#fff">A</text>
    <text x="300" y="266" fill="#fff">B</text>
    <text x="400" y="266" fill="#fff">C</text>
    <text x="500" y="266" fill="#fff">D</text>
  </g>

  <text x="350" y="38" font-family="Georgia, serif" font-size="20" text-anchor="middle" fill="#222" font-weight="700">1st Position — finger placement (whole-step pattern shown)</text>
  <text x="350" y="332" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#666" font-style="italic">Half-step locations between fingers 2 &amp; 3 depend on key; this map shows A/D major pattern.</text>
</svg>
