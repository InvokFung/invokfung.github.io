<text x="550.0" y="528.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Edge numbers are indices. Highlighted: A₃ is normal.</text>
<text x="40.0" y="574.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Same position = matching pair: bigger subgroup, smaller fixed field. ⟨τ⟩ fixes ℚ(α); ⟨στ⟩ fixes ℚ(αω²); ⟨σ²τ⟩ fixes ℚ(αω); ⟨σ⟩ fixes ℚ(ω).</text>
<text x="40.0" y="602.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Abstract Algebra 05, Chapter 6 (worked example 2). σ: α ↦ αω, ω ↦ ω; τ: α ↦ α, ω ↦ ω² (complex conjugation).</text>
