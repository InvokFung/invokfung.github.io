<text x="40.0" y="556.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">φ(12) = 4 units, because a class [a] is invertible exactly when gcd(a, 12) = 1 (Theorem 5.2).</text>
<text x="40.0" y="582.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Abstract Algebra 00, Chapter 3 (extended Euclidean algorithm) and Chapter 5 (units and zero divisors).</text>
