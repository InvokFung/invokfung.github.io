<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Left: the extended Euclidean algorithm for 240 and 46. Each row keeps a remainder r and integers s, t with r = 240 s + 46 t; the last non-zero remainder 2 gives 2 = 240 times -9 plus 46 times 47. Right: the twelve classes of Z/12Z on a clock; the units 1, 5, 7, 11 are highlighted and each is its own inverse, while 3 times 4, 2 times 6 and 4 times 9 are 0.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="600" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="598.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Extended Euclid, and who has an inverse mod 12</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Bézout coefficients carried row by row; the classes coprime to 12 are exactly the units.</text>
