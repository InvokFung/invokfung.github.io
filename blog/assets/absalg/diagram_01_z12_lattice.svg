<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Subgroup lattice of Z/12Z. Top: the whole group, generated by 1, order 12. Next: the subgroup generated by 2 (order 6, elements 0 2 4 6 8 10) and by 3 (order 4, elements 0 3 6 9). Next: generated by 4 (order 3, elements 0 4 8) and by 6 (order 2, elements 0 6). Bottom: the trivial subgroup. Lines join a subgroup to the ones directly above it that contain it. Right: the elements of Z/12Z grouped by order; there are phi(d) elements of order d.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
