<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="S3 split into cosets three ways. Left cosets of H = {e, (2 3)}: {e, (2 3)}, {(1 2 3), (1 2)}, {(1 3 2), (1 3)}. Right cosets of H: {e, (2 3)}, {(1 2 3), (1 3)}, {(1 3 2), (1 2)}; they pair the elements differently, so H is not normal. Cosets of A3: the rotations {e, (1 2 3), (1 3 2)} and the reflections {(2 3), (1 2), (1 3)}, the same on both sides, so A3 is normal.">
