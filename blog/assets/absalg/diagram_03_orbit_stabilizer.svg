<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Orbit-stabilizer theorem for the square: D4 has 8 elements; the stabilizer of vertex 1 is {e, s}; its four cosets {e, s}, {r, rs}, {r^2, r^2 s}, {r^3, r^3 s} send vertex 1 to vertices 1, 2, 3, 4; so orbit size 4 times stabilizer size 2 equals 8">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="560" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="558.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Orbit–stabilizer on the square</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">D4 (order 8) acts on the vertices. Each coset of the stabilizer sends vertex 1 to one vertex.</text>
<rect x="40.0" y="104.0" width="350.0" height="400.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="60.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">The square, vertices counter-clockwise</text>
<path d="M110,405 L320,405 L320,195 L110,195 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="92.0" y1="423.0" x2="354.0" y2="161.0" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="358.0" y="155.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">axis of s</text>
<path d="M200.0,258.7 A44,44 0 0 0 200.0,341.3" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="177.0" y="234.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">r: 90° turn,</text>
<text x="177.0" y="250.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">counter-clockwise</text>
<circle cx="110" cy="405" r="17" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.4"/>
<text x="110.0" y="410.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle">1</text>
<circle cx="320" cy="405" r="17" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
<text x="320.0" y="410.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">2</text>
<circle cx="320" cy="195" r="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.4"/>
<text x="320.0" y="200.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">3</text>
<circle cx="110" cy="195" r="17" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2.4"/>
<text x="110.0" y="200.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="middle">4</text>
<text x="60.0" y="456.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">r = (1 2 3 4)</text>
<text x="210.0" y="456.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">s = (2 4)</text>
<text x="60.0" y="476.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">s fixes vertices 1 and 3</text>
<text x="420.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Cosets of the stabilizer G₁ = {e, s}</text>
<text x="770.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">where they send vertex 1</text>
<rect x="420.0" y="152.0" width="250.0" height="52.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="436.0" y="184.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#0d9488" text-anchor="start">{ e,  s }</text>
<text x="656.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">G₁ itself</text>
<line x1="682.0" y1="178.0" x2="766.0" y2="178.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="724.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">1 ↦</text>
<circle cx="792" cy="178" r="17" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.4"/>
<text x="792.0" y="183.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle">1</text>
<text x="820.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">vertex 1</text>
<rect x="420.0" y="222.0" width="250.0" height="52.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="436.0" y="254.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#d97706" text-anchor="start">{ r,  rs }</text>
<text x="656.0" y="254.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">rG₁</text>
<line x1="682.0" y1="248.0" x2="766.0" y2="248.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="724.0" y="240.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">1 ↦</text>
<circle cx="792" cy="248" r="17" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
<text x="792.0" y="253.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="middle">2</text>
<text x="820.0" y="253.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">vertex 2</text>
<rect x="420.0" y="292.0" width="250.0" height="52.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="436.0" y="324.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="start">{ r²,  r²s }</text>
<text x="656.0" y="324.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">r²G₁</text>
<line x1="682.0" y1="318.0" x2="766.0" y2="318.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="724.0" y="310.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">1 ↦</text>
<circle cx="792" cy="318" r="17" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.4"/>
<text x="792.0" y="323.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">3</text>
<text x="820.0" y="323.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">vertex 3</text>
<rect x="420.0" y="362.0" width="250.0" height="52.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<text x="436.0" y="394.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#dc4c3a" text-anchor="start">{ r³,  r³s }</text>
<text x="656.0" y="394.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">r³G₁</text>
<line x1="682.0" y1="388.0" x2="766.0" y2="388.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="724.0" y="380.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">1 ↦</text>
<circle cx="792" cy="388" r="17" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2.4"/>
<text x="792.0" y="393.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="middle">4</text>
<text x="820.0" y="393.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">vertex 4</text>
<text x="420.0" y="450.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Both elements of a coset move vertex 1 to the same place,</text>
<text x="420.0" y="470.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">and different cosets move it to different places.</text>
<rect x="420.0" y="486.0" width="540.0" height="42.0" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
<text x="690.0" y="513.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">orbit size 4  ×  stabilizer size 2  =  8  =  |D4|</text>
<text x="40.0" y="542.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Abstract Algebra 03, Chapter 3 (orbit–stabilizer theorem, worked example D4 on the square).</text>
</svg>