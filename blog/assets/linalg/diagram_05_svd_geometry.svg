<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">A = UΣVᵀ for A = [[3, 0], [4, 5]], applied to the unit circle from right to left. All four panels at the same scale.</text>
