<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-label="The SVD of A = [[3,0],[4,5]] as three steps on the unit circle: V transpose rotates by -45 degrees so v1 and v2 go to e1 and e2; Sigma stretches by 3 root 5 = 6.708 and root 5 = 2.236 into an axis-aligned ellipse; U rotates by 71.6 degrees so the axes point along u1 and u2. The result is the image of the unit circle under A.">
