<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="The unit square under four 2 by 2 matrices: the identity keeps area 1; A with columns (2,1) and (1,2) gives a parallelogram of area 3 with orientation kept, det 3; B with the columns swapped gives the same parallelogram with orientation reversed, det -3; C with columns (2,2) and (1,1) flattens the square onto the line y = x, det 0.">
