<text x="40.0" y="522.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">|det| = area of the image of the unit square (dashed).  Sign of det = orientation: swapping two columns flips it.</text>
