<path d="M728.0,108.0 L734.0,108.0 L734.0,164.0 L728.0,164.0" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="678.0" y="129.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">4</text>
<text x="710.0" y="129.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">1</text>
<text x="678.0" y="153.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">2</text>
<text x="710.0" y="153.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">3</text>
<text x="750.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">p(λ) = λ² − 7λ + 10</text>
<text x="750.0" y="152.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">= (λ − 5)(λ − 2)</text>
<rect x="610.0" y="182.0" width="350.0" height="84.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.4"/>
<text x="626.0" y="208.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">λ = 5, eigenvector (1, 1)</text>
<text x="626.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">A(1, 1) = (5, 5) = 5(1, 1)</text>
<text x="626.0" y="250.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">stays on its line, stretched by 5</text>
<rect x="610.0" y="278.0" width="350.0" height="84.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
<text x="626.0" y="304.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="start">λ = 2, eigenvector (1, −2)</text>
<text x="626.0" y="326.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">A(1, −2) = (2, −4) = 2(1, −2)</text>
<text x="626.0" y="346.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">stays on its line, stretched by 2</text>
<rect x="610.0" y="374.0" width="350.0" height="84.0" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
<text x="626.0" y="400.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">e1 = (1, 0) goes to (4, 2)</text>
<text x="626.0" y="422.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">not an eigenvector</text>
<text x="626.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">turns about 26.6° counter-clockwise</text>
<rect x="610.0" y="470.0" width="350.0" height="84.0" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.4"/>
<text x="626.0" y="496.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">e2 = (0, 1) goes to (1, 3)</text>
<text x="626.0" y="518.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">not an eigenvector</text>
<text x="626.0" y="538.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">turns about 18.4° clockwise</text>
<text x="610.0" y="580.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Checks: trace 7 = 5 + 2,  det 10 = 5 · 2</text>
<text x="40.0" y="622.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Linear Algebra 04, Chapters 1-2 (running example). Drawn to scale: 1 unit = 44 px.</text>
