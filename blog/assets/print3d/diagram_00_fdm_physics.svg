<line x1="710.0" y1="285.0" x2="710.0" y2="319.0" stroke="#dc4c3a" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>
<circle cx="780" cy="230" r="11" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
<line x1="790.0" y1="224.0" x2="862.0" y2="214.0" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="862.0" y="168.0" width="84.0" height="96.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="870.0" y="180.0" width="68.0" height="34.0" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<rect x="870.0" y="218.0" width="68.0" height="34.0" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<path d="M880,204 q5,6 0,12 q-5,6 0,12" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M897,204 q5,6 0,12 q-5,6 0,12" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M914,204 q5,6 0,12 q-5,6 0,12" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M931,204 q5,6 0,12 q-5,6 0,12" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="904.0" y="282.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">the weld</text>
<text x="540.0" y="330.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0d9488" text-anchor="start">Along the roads: strong</text>
<text x="540.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Continuous polymer chains run through each road.</text>
<text x="540.0" y="369.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Failure is ductile yielding.</text>
<text x="540.0" y="408.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#dc4c3a" text-anchor="start">Across the layers: weak</text>
<text x="540.0" y="428.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Only chains that diffused across each weld carry load.</text>
<text x="540.0" y="447.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Failure is a clean, brittle-looking split on one layer line.</text>
<line x1="540.0" y1="470.0" x2="940.0" y2="470.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<text x="540.0" y="494.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Weld strength follows interface temperature and time above it:</text>
<text x="548.0" y="518.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">+</text>
<text x="562.0" y="518.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">hotter nozzle: stronger layer bond</text>
<text x="548.0" y="538.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">+</text>
<text x="562.0" y="538.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">enclosure: slower cooling at the interface</text>
<text x="548.0" y="558.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc4c3a" text-anchor="middle">−</text>
<text x="562.0" y="558.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">more part cooling: weaker bond, better overhangs</text>
<rect x="40.0" y="598.0" width="920.0" height="76.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.4"/>
<text x="60.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0d9488" text-anchor="start">The real speed limit is volumetric flow:</text>
<text x="356.0" y="624.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">width × layer height × speed</text>
<text x="60.0" y="650.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">0.42 mm × 0.20 mm × 150 mm/s ≈ 12.6 mm³/s</text>
<text x="470.0" y="650.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">If the hotend cannot melt that much, the print under-extrudes.</text>
<text x="40.0" y="702.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: 3D Printing Course 00, Chapters 3 and 4. Labels and numbers from the post; drawing not to scale.</text>
</svg>