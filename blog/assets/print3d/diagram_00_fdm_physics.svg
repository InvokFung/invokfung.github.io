<line x1="104.0" y1="271.0" x2="196.0" y2="271.0" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
<line x1="104.0" y1="282.0" x2="196.0" y2="282.0" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
<line x1="104.0" y1="293.0" x2="196.0" y2="293.0" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
<rect x="135.0" y="300.0" width="30.0" height="28.0" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<rect x="96.0" y="328.0" width="108.0" height="76.0" rx="6" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<circle cx="184" cy="350" r="9" fill="#ffffff" stroke="#dc4c3a" stroke-width="1.8"/>
<circle cx="116" cy="386" r="5" fill="#ffffff" stroke="#dc4c3a" stroke-width="1.6"/>
<path d="M118,404 L182,404 L156,440 L144,440 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="142.0" y="146.0" width="16.0" height="186.0" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="142.0" y="328" width="16" height="110" fill="url(#melt)" stroke="none"/>
<circle cx="123.0" cy="180" r="18" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="123.0" cy="180" r="4" fill="#1f2937"/>
<circle cx="177.0" cy="180" r="18" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="177.0" cy="180" r="4" fill="#1f2937"/>
<line x1="150.0" y1="150.0" x2="150.0" y2="166.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="60.0" y="446.0" width="90.0" height="12.0" rx="6" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
<rect x="60.0" y="459.0" width="176.0" height="12.0" rx="6" fill="#fdba74" stroke="#fb923c" stroke-width="1"/>
<rect x="60.0" y="472.0" width="176.0" height="12.0" rx="6" fill="#fdba74" stroke="#fb923c" stroke-width="1"/>
<line x1="202.0" y1="171.0" x2="254.0" y2="171.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="202" cy="171" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Extruder gears</text>
<text x="262.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">push a set length of filament</text>
<line x1="162.0" y1="213.0" x2="254.0" y2="213.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="162" cy="213" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="218.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Solid filament = the plunger</text>
<text x="262.0" y="237.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">flow is set by distance, not pressure</text>
<line x1="206.0" y1="261.0" x2="254.0" y2="261.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="206" cy="261" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="266.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="start">Heatsink + fan</text>
<text x="262.0" y="285.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">cold side; fan never off while hot</text>
<line x1="169.0" y1="313.0" x2="254.0" y2="313.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="169" cy="313" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="318.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Heatbreak</text>
<text x="262.0" y="337.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">keeps the melt zone short</text>
<line x1="208.0" y1="357.0" x2="254.0" y2="357.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="208" cy="357" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="362.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#dc4c3a" text-anchor="start">Heater block</text>
<text x="262.0" y="381.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">cartridge heater + thermistor</text>
<line x1="162.0" y1="397.0" x2="254.0" y2="397.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="162" cy="397" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="402.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#d97706" text-anchor="start">Melt zone</text>
<text x="262.0" y="421.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">polymer is a viscous fluid here</text>
<line x1="174.0" y1="437.0" x2="254.0" y2="437.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="174" cy="437" r="2.5" fill="#9ca3af"/>
<text x="262.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#d97706" text-anchor="start">Nozzle</text>
<text x="262.0" y="461.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">0.4 mm is the default</text>
<text x="60.0" y="506.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">new road, laid as the nozzle moves right</text>
<rect x="56.0" y="520.0" width="428.0" height="46.0" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="70.0" y="539.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Heat creep: the melt zone moves up past the heatbreak,</text>
<text x="70.0" y="557.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">softens filament in the cold section, and jams it.</text>
<rect x="520.0" y="100.0" width="440.0" height="480.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="540.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1f2937" text-anchor="start">Why Z is the weak direction</text>
<text x="540.0" y="152.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Side view of printed layers (each strip is one road).</text>
<rect x="610.0" y="196.0" width="200.0" height="16.0" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<rect x="610.0" y="213.0" width="200.0" height="16.0" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<rect x="610.0" y="230.0" width="200.0" height="16.0" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<rect x="610.0" y="247.0" width="200.0" height="16.0" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
<rect x="610.0" y="264.0" width="200.0" height="16.0" rx="7" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
