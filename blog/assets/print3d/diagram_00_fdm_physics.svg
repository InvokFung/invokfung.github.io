<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-label="FDM hotend from cold to hot, with the filament acting as a plunger, and a stack of printed layers showing that loads along the roads are strong while loads across the layers are weak">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="720" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="718.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">FDM in one picture: a plunger, a melt zone, and welds</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Solid filament pushes molten polymer out of the nozzle. Layers hold together only where chains cross each weld.</text>
<rect x="40.0" y="100.0" width="460.0" height="480.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1f2937" text-anchor="start">The hotend, cold to hot</text>
<defs><linearGradient id="melt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbd5e1"/><stop offset="0.35" stop-color="#fcd34d"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
<rect x="98.0" y="228.0" width="104.0" height="72.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<line x1="104.0" y1="238.0" x2="196.0" y2="238.0" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
<line x1="104.0" y1="249.0" x2="196.0" y2="249.0" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
