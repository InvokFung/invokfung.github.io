<text x="40.0" y="634.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Tg, not the melting point, is the real service ceiling: above it the part sags and creeps.</text>
<text x="40.0" y="656.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Tg values vary by 10–20 °C between sources. Read them as a ranking: PLA &lt; PETG &lt; ABS/ASA &lt; PC.</text>
<text x="40.0" y="682.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: 3D Printing Course 04 — Process window, Character and Drying tables; Chapter 6 and 7 for annealing and service limits.</text>
