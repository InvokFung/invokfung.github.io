<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-label="Nested scope boxes Built-in, Global, Enclosing and Local holding the post's x example, with the lookup order L, E, G, B">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="610" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="608.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Scope: where Python looks up a name (LEGB)</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Python checks Local, then Enclosing, then Global, then Built-in. The x it finds first is the one you get.</text>
<rect x="40.0" y="100.0" width="560.0" height="468.0" rx="12" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="56.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Built-in</text>
<text x="128.8" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">print, len, etc.</text>
<rect x="60.0" y="146.0" width="520.0" height="406.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="76.0" y="172.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">Global</text>
<text x="133.6" y="172.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">the module's top level</text>
<text x="80.0" y="200.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">x = "global"</text>
<text x="80.0" y="224.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">def outer():</text>
<rect x="100.0" y="238.0" width="460.0" height="248.0" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="116.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">Enclosing</text>
<text x="196.4" y="264.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">outer(), the enclosing function</text>
<text x="120.0" y="290.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">x = "enclosing"</text>
<text x="120.0" y="314.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">def inner():</text>
<rect x="140.0" y="328.0" width="400.0" height="92.0" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="156.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">Local</text>
<text x="206.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">inner(), the current function</text>
<text x="160.0" y="380.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">x = "local"</text>
<text x="160.0" y="404.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">print(x)</text>
<text x="243.2" y="404.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start"># "local"</text>
<text x="120.0" y="448.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">inner()</text>
<text x="120.0" y="472.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">print(x)</text>
<text x="203.2" y="472.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start"># "enclosing"</text>
<text x="80.0" y="510.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">outer()</text>
<text x="80.0" y="534.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">print(x)</text>
<text x="163.2" y="534.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start"># "global"</text>
<line x1="606.0" y1="121.0" x2="634.0" y2="121.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 4"/>
<circle cx="652.0" cy="121.0" r="12" fill="#1f2937"/>
<text x="652.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="674.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">B · Built-in</text>
<text x="674.0" y="146.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">print, len, etc.</text>
<line x1="586.0" y1="167.0" x2="634.0" y2="167.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 4"/>
<circle cx="652.0" cy="167.0" r="12" fill="#2563eb"/>
<text x="652.0" y="172.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="674.0" y="172.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">G · Global</text>
<text x="674.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">at the module's top level</text>
<line x1="566.0" y1="259.0" x2="634.0" y2="259.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 4"/>
<circle cx="652.0" cy="259.0" r="12" fill="#7c3aed"/>
<text x="652.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="674.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="start">E · Enclosing</text>
<text x="674.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">outer functions (if nested)</text>
<line x1="546.0" y1="349.0" x2="634.0" y2="349.0" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 4"/>
<circle cx="652.0" cy="349.0" r="12" fill="#0d9488"/>
<text x="652.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="674.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">L · Local</text>
<text x="674.0" y="374.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">inside the current function</text>
<line x1="652.0" y1="335.0" x2="652.0" y2="273.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="652.0" y1="245.0" x2="652.0" y2="181.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="652.0" y1="153.0" x2="652.0" y2="135.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="674.0" y="310.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="start" font-style="italic">not found? look one level out</text>
<rect x="630.0" y="430.0" width="330.0" height="138.0" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="648.0" y="456.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">To assign to an outer name</text>
<text x="648.0" y="484.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">global counter</text>
<text x="790.0" y="484.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">→ the Global one</text>
<text x="648.0" y="510.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">nonlocal x</text>
<text x="790.0" y="510.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">→ the Enclosing one</text>
<text x="648.0" y="540.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Escape hatches. Prefer returning values</text>
<text x="648.0" y="558.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">to changing outer state.</text>
<text x="40.0" y="592.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">The code is the post's LEGB example; the three printed values come from running it.</text>
</svg>