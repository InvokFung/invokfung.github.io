<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The container sees one merged tree. Only the top layer can change, and it belongs to that container alone.</text>
