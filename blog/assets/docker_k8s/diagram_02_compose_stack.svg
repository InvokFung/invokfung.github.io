<path d="M800,249 L800,315 A80.0,9 0 0 0 960,315 L960,249" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<ellipse cx="880.0" cy="249" rx="80.0" ry="9" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="880.0" y="282.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">pgdata</text>
<text x="880.0" y="302.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">named volume</text>
<path d="M800,377 L800,443 A80.0,9 0 0 0 960,443 L960,377" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<ellipse cx="880.0" cy="377" rx="80.0" ry="9" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="880.0" y="410.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">redisdata</text>
<text x="880.0" y="430.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">named volume</text>
<line x1="728.0" y1="284.0" x2="797.0" y2="284.0" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="728.0" y1="412.0" x2="797.0" y2="412.0" stroke="#d97706" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="880.0" y="342.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">/var/lib/postgresql/data</text>
<text x="880.0" y="470.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">/data</text>
<rect x="40.0" y="504.0" width="920.0" height="118.0" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="532.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">localhost inside web</text>
<text x="282.0" y="532.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">means web itself. Peers are addressed by service name and their own port.</text>
<text x="60.0" y="556.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">docker compose down</text>
<text x="282.0" y="556.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">removes the containers and the project network; pgdata and redisdata are kept.</text>
<text x="60.0" y="580.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="start">docker compose down -v</text>
<text x="282.0" y="580.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">also removes the named volumes: the command that wipes the database.</text>
<text x="60.0" y="604.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">service_healthy</text>
<text x="282.0" y="604.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">web starts only after db and cache report healthy, so the first request works.</text>
<text x="40.0" y="646.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: the post's compose.yaml and the notes under it (Chapter 4).</text>
</svg>