<text x="392.0" y="266.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">db:5432</text>
<line x1="340.0" y1="340.0" x2="449.0" y2="400.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="388.0" y="410.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">cache:6379</text>
<line x1="328.0" y1="148.0" x2="328.0" y2="247.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
