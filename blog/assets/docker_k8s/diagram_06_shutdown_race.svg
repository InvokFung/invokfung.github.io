<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-label="Two timelines of a Pod being deleted: without preStop, SIGTERM arrives while proxies still send traffic; with a 10 second preStop sleep, endpoint removal finishes before SIGTERM">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="676" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="674.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Why deploys drop requests: the endpoint-removal race</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Deleting a Pod starts two paths at once. SIGTERM is local and instant; endpoint removal spreads across the cluster.</text>
<rect x="40.0" y="98.0" width="920.0" height="212.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="58.0" y="126.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">Without preStop</text>
<text x="206.4" y="126.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">grace = default 30 s</text>
<line x1="250.0" y1="142.0" x2="250.0" y2="294.0" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="58.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Path A</text>
<text x="58.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">kubelet, this node</text>
<text x="58.0" y="248.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Path B</text>
<text x="58.0" y="266.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">endpoints, every node</text>
<text x="250.0" y="146.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">t=0  Pod marked Terminating</text>
<line x1="250.0" y1="164.0" x2="250.0" y2="216.0" stroke="#dc4c3a" stroke-width="3" stroke-linecap="round"/>
<text x="250.0" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="middle"></text>
<text x="258.0" y="162.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="start">SIGTERM at once</text>
<rect x="254.0" y="170.0" width="306.0" height="40" rx="7" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.6"/>
<text x="264.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="start">stopped accepting new connections</text>
<rect x="560.0" y="170.0" width="310.0" height="40" rx="7" fill="#f9fafb" stroke="#1f2937" stroke-width="1.6"/>
<text x="570.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">drains, exits</text>
<line x1="900.0" y1="164.0" x2="900.0" y2="216.0" stroke="#dc4c3a" stroke-width="3" stroke-linecap="round"/>
<text x="900.0" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="middle"></text>
<text x="950.0" y="232.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="end">SIGKILL at 30 s if not exited</text>
<rect x="254.0" y="234.0" width="306.0" height="40" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="264.0" y="259.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="start">proxies still send traffic to this Pod</text>
<text x="572.0" y="259.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">hundreds of ms to several seconds</text>
<rect x="364.0" y="214.0" width="190.0" height="20.0" rx="10" fill="#ffffff" stroke="#dc4c3a" stroke-width="1.2"/>
<text x="459.0" y="228.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="middle">overlap = 502s, resets</text>
<rect x="40.0" y="330.0" width="920.0" height="212.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="58.0" y="358.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">With preStop</text>
<text x="179.5" y="358.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">sleep 10 · terminationGracePeriodSeconds: 60</text>
<line x1="250.0" y1="374.0" x2="250.0" y2="526.0" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="58.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Path A</text>
<text x="58.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">kubelet, this node</text>
<text x="58.0" y="480.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Path B</text>
<text x="58.0" y="498.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">endpoints, every node</text>
<text x="250.0" y="378.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">t=0  Pod marked Terminating</text>
<rect x="254.0" y="402.0" width="386.0" height="40" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="264.0" y="427.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="start">preStop: sleep 10 s, still healthy, still serving</text>
<line x1="640.0" y1="396.0" x2="640.0" y2="448.0" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
<text x="640.0" y="390.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d9488" text-anchor="middle"></text>
<text x="648.0" y="394.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d9488" text-anchor="start">SIGTERM</text>
<rect x="644.0" y="402.0" width="226.0" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="654.0" y="427.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">finish in-flight, exit</text>
<line x1="900.0" y1="396.0" x2="900.0" y2="448.0" stroke="#dc4c3a" stroke-width="3" stroke-linecap="round"/>
<text x="900.0" y="390.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="middle"></text>
<text x="950.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="end">SIGKILL at 60 s if not exited</text>
<rect x="254.0" y="466.0" width="306.0" height="40" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="264.0" y="491.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="start">proxies learn the Pod is gone</text>
<circle cx="578" cy="486" r="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M574.0,486.0 l2.9,2.9 l5.2,-5.6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="594.0" y="491.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a" text-anchor="start">done before SIGTERM</text>
<line x1="250.0" y1="532.0" x2="900.0" y2="532.0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahm)" marker-start="url(#ahm)"/>
<rect x="405.0" y="521.0" width="340.0" height="22.0" rx="4" fill="#fbfbfc" stroke="#fbfbfc" stroke-width="0"/>
<text x="575.0" y="537.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="middle">grace period covers preStop + drain: set it above both</text>
<text x="40.0" y="568.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">It only works if:</text>
<circle cx="50" cy="585" r="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<path d="M46.9,585.0 l2.2,2.2 l4.1,-4.3" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.0" y="590.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the app really handles SIGTERM (finishes in-flight requests, closes pools, flushes buffers);</text>
<circle cx="50" cy="607" r="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<path d="M46.9,607.0 l2.2,2.2 l4.1,-4.3" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.0" y="612.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">PID 1 receives the signal: exec-form CMD or an init such as tini, not sh -c (Post 01);</text>
<circle cx="50" cy="629" r="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<path d="M46.9,629.0 l2.2,2.2 l4.1,-4.3" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.0" y="634.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the grace period is set from measurement: a SIGKILL means exit code 137 and in-flight work lost.</text>
<text x="40.0" y="658.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: the post's termination timeline, preStop example and requirements (Chapter 5). Bars are not to scale.</text>
</svg>