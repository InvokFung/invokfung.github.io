<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-label="Stack and heap for the foo() example: x, arr and p live on the stack, p points to an int on the heap; plus the three classic bugs: leak, double free and dangling pointer">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="820" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="818.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Stack and heap: where foo()'s data lives</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">p itself sits on the stack. Its value is the address of an int that new put on the heap.</text>
<defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker></defs>
<defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#dc4c3a"/></marker></defs>
<rect x="40.0" y="104.0" width="340.0" height="148.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/>
<text x="56.0" y="130.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">void foo() {</text>
<text x="56.0" y="151.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">    int x = 5;            // stack</text>
<text x="56.0" y="172.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5eead4" text-anchor="start">    int arr[100];         // stack</text>
<text x="56.0" y="193.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">    int* p = new int(7);  // heap</text>
<text x="56.0" y="214.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#fcd34d" text-anchor="start">    delete p;</text>
<text x="56.0" y="235.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#e2e8f0" text-anchor="start">}</text>
<text x="40.0" y="286.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Reading the pointer</text>
<text x="40.0" y="314.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="start">int* p</text>
<text x="132.0" y="314.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">p holds an address</text>
<text x="40.0" y="339.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="start">*p</text>
<text x="132.0" y="339.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">the value at that address: 7</text>
<text x="40.0" y="364.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#7c3aed" text-anchor="start">delete p</text>
<text x="132.0" y="364.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">frees the heap int</text>
<rect x="410.0" y="100.0" width="250.0" height="370.0" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="428.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#0d9488" text-anchor="start">Stack</text>
<text x="642.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="end">automatic</text>
<rect x="426.0" y="148.0" width="218.0" height="206.0" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
<text x="438.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">foo()'s frame</text>
<rect x="438.0" y="182.0" width="194.0" height="38.0" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="452.0" y="206.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">x</text>
<text x="618.0" y="206.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#1f2937" text-anchor="end">5</text>
<rect x="438.0" y="230.0" width="194.0" height="56.0" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="452.0" y="263.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">arr[100]</text>
<text x="618.0" y="263.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b7280" text-anchor="end">100 ints</text>
<rect x="438.0" y="296.0" width="194.0" height="38.0" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="452.0" y="320.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">p</text>
<text x="618.0" y="320.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#d97706" text-anchor="end">address</text>
<text x="428.0" y="384.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Made on function entry</text>
<text x="428.0" y="406.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Gone when foo() returns</text>
<text x="428.0" y="428.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Very fast</text>
<text x="428.0" y="450.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Limited: ~1–8 MB usually</text>
<rect x="710.0" y="100.0" width="250.0" height="370.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="728.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="start">Heap</text>
<text x="942.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="end">manual</text>
<rect x="726.0" y="148.0" width="218.0" height="206.0" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
<rect x="800.0" y="293.0" width="70.0" height="44.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="835.0" y="321.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">7</text>
<text x="835.0" y="261.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">an int made by new int(7)</text>
<text x="835.0" y="281.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">stays until delete p</text>
<text x="728.0" y="384.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">You ask for it (new) or a</text>
<text x="728.0" y="406.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">smart pointer does</text>
<text x="728.0" y="428.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Lives until you free it</text>
<text x="728.0" y="450.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Slower (allocator overhead)</text>
<line x1="638.0" y1="315.0" x2="796.0" y2="315.0" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aa)"/>
<circle cx="632.0" cy="315.0" r="4.5" fill="#d97706"/>
<text x="685.0" y="305.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle">*p</text>
<text x="40.0" y="512.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">What goes wrong with raw new / delete</text>
<text x="40.0" y="536.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">These three bugs are why manual memory management is the hardest part of C++.</text>
<rect x="40.0" y="554.0" width="293.0" height="190.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<circle cx="66" cy="580" r="9" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M62.6,576.6 L69.4,583.4 M69.4,576.6 L62.6,583.4" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84.0" y="585.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">Memory leak</text>
<text x="56.0" y="616.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">int* q = new int(7);</text>
<text x="56.0" y="635.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">// ... forget to delete q ...</text>
<text x="56.0" y="708.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Nothing ever frees it:</text>
<text x="56.0" y="728.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">the process holds that memory forever.</text>
<rect x="223.0" y="657.0" width="44" height="30" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="245.0" y="677.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">7</text>
<text x="56.0" y="677.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">heap int, never deleted:</text>
<rect x="353.0" y="554.0" width="293.0" height="190.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<circle cx="379" cy="580" r="9" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M375.6,576.6 L382.4,583.4 M382.4,576.6 L375.6,583.4" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="397.0" y="585.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">Double free</text>
<text x="369.0" y="616.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">int* p = new int(5);</text>
<text x="369.0" y="635.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">delete p;</text>
<text x="369.0" y="654.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">delete p;</text>
<text x="369.0" y="708.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Freeing the same memory twice:</text>
<text x="369.0" y="728.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">undefined behaviour, often a crash.</text>
<rect x="571.0" y="634.0" width="44" height="30" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
<text x="593.0" y="654.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">5</text>
<line x1="455.0" y1="630.0" x2="565.0" y2="644.0" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" marker-end="url(#ac)"/>
<line x1="455.0" y1="649.0" x2="565.0" y2="651.0" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" marker-end="url(#ac)"/>
<text x="593.0" y="684.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc4c3a" text-anchor="middle">freed twice</text>
<rect x="666.0" y="554.0" width="293.0" height="190.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<circle cx="692" cy="580" r="9" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M688.6,576.6 L695.4,583.4 M695.4,576.6 L688.6,583.4" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="710.0" y="585.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">Dangling pointer</text>
<text x="682.0" y="616.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">int* r;</text>
<text x="682.0" y="635.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">{ int local = 5; r = &amp;local; }</text>
<text x="682.0" y="654.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">*r;   // local is gone</text>
<text x="682.0" y="708.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">r still holds the old address.</text>
<text x="682.0" y="728.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Reading it is undefined behaviour.</text>
<rect x="851.0" y="663.0" width="88.0" height="30.0" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="895.0" y="683.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#9ca3af" text-anchor="middle">local</text>
<line x1="854.0" y1="666.0" x2="936.0" y2="690.0" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round"/>
<text x="682.0" y="683.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">r</text>
<line x1="698.0" y1="678.0" x2="846.0" y2="678.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="40.0" y="772.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">The modern fix: smart pointers (Post 05) free the memory for you, so you rarely write new or delete.</text>
<text x="40.0" y="802.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: this post, Chapter 4 (new and delete) and Chapter 5 (stack vs heap).</text>
</svg>