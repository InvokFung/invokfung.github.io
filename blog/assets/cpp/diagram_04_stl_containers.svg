<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-label="What is inside the main STL containers: vector is a dynamic array, deque a segmented array, list a doubly linked list, map and set a balanced tree, unordered_map and unordered_set a hash table">
