<text x="52.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="74.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Write the files</text>
<text x="250.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">a header declares greet(); two .cpp files define and use it</text>
<rect x="40.0" y="138.0" width="250.0" height="205.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="56.0" y="166.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start">greeter.h</text>
<text x="56.0" y="188.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">header: declarations</text>
<line x1="56.0" y1="202.0" x2="274.0" y2="202.0" stroke="#ddd6fe" stroke-width="1.2" stroke-linecap="round"/>
<text x="56.0" y="224.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">#pragma once</text>
<text x="56.0" y="243.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">#include &lt;string&gt;</text>
<text x="56.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">std::string greet(</text>
<text x="56.0" y="281.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">    const std::string&amp; name);</text>
<text x="56.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="start">Pulled into both .cpp files</text>
<text x="56.0" y="327.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="start">by the violet #include lines.</text>
