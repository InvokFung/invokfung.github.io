<text x="331.0" y="166.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">greeter.cpp</text>
<text x="331.0" y="188.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">source: defines greet()</text>
<line x1="331.0" y1="202.0" x2="604.0" y2="202.0" stroke="#99f6e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="331.0" y="224.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#7c3aed" text-anchor="start">#include "greeter.h"</text>
<text x="331.0" y="243.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">std::string greet(</text>
<text x="331.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">        const std::string&amp; name) {</text>
<text x="331.0" y="281.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">    return "Hello, " + name + "!";</text>
<text x="331.0" y="300.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">}</text>
<rect x="645.0" y="138.0" width="315.0" height="205.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="661.0" y="166.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">main.cpp</text>
<text x="661.0" y="188.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">source: main() uses greet()</text>
<line x1="661.0" y1="202.0" x2="944.0" y2="202.0" stroke="#bfdbfe" stroke-width="1.2" stroke-linecap="round"/>
<text x="661.0" y="224.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">#include &lt;iostream&gt;</text>
<text x="661.0" y="243.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#7c3aed" text-anchor="start">#include "greeter.h"</text>
<text x="661.0" y="262.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">int main() {</text>
<text x="661.0" y="281.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">  std::cout &lt;&lt; greet("Ada") &lt;&lt; "\n";</text>
<text x="661.0" y="300.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">  return 0;</text>
<text x="661.0" y="319.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">}</text>
