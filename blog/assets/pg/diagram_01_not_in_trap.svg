<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 742" width="1000" height="742" role="img" aria-label="The NOT IN trap: WHERE keeps a row only when its test is true; with a NULL in the list, x NOT IN (list) becomes true AND NULL, which is NULL, so every row is filtered out">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="742" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="740.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">The NOT IN trap: one NULL empties the result</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">WHERE keeps a row only when the test is true. NULL is not true, so the row is dropped, silently.</text>
<circle cx="52.0" cy="118.0" r="12" fill="#1f2937"/>
<text x="52.0" y="123.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="74.0" y="124.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">What WHERE keeps</text>
<rect x="40.0" y="150.0" width="110.0" height="36.0" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
<text x="95.0" y="173.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">true</text>
<line x1="152.0" y1="168.0" x2="244.0" y2="168.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="310" cy="168" r="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M305.1,168.0 l3.5,3.5 l6.4,-6.8" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330.0" y="173.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#16a34a" text-anchor="start">row kept</text>
<rect x="40.0" y="208.0" width="110.0" height="36.0" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
<text x="95.0" y="231.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">false</text>
<line x1="152.0" y1="226.0" x2="244.0" y2="226.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="310" cy="226" r="11" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M305.8,221.8 L314.2,230.2 M314.2,221.8 L305.8,230.2" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330.0" y="231.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="start">row dropped</text>
<rect x="40.0" y="266.0" width="110.0" height="36.0" rx="18" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="95.0" y="289.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">NULL</text>
<line x1="152.0" y1="284.0" x2="244.0" y2="284.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)"/>
<circle cx="310" cy="284" r="11" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M305.8,279.8 L314.2,288.2 M314.2,279.8 L305.8,288.2" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330.0" y="289.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="start">row dropped</text>
<rect x="246.0" y="146.0" width="30.0" height="160.0" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="261" y="231.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 261 226.0)">WHERE</text>
<text x="40.0" y="336.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">NULL behaves like false at filter time,</text>
<text x="40.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">but it is not false anywhere else.</text>
<circle cx="482.0" cy="118.0" r="12" fill="#1f2937"/>
<text x="482.0" y="123.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="504.0" y="124.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Work out  2 NOT IN (1, NULL)</text>
<rect x="470.0" y="146.0" width="250.0" height="36.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.4"/>
<text x="484.0" y="169.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="start">2 NOT IN (1, NULL)</text>
<text x="734.0" y="169.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">the test</text>
<rect x="470.0" y="196.0" width="250.0" height="36.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.4"/>
<text x="484.0" y="219.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="start">= 2 &lt;&gt; 1  AND  2 &lt;&gt; NULL</text>
<text x="734.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">NOT IN = not equal to every item</text>
<rect x="470.0" y="246.0" width="250.0" height="36.0" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1.4"/>
<text x="484.0" y="269.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#e2e8f0" text-anchor="start">= true  AND  NULL</text>
<text x="734.0" y="269.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">comparing with NULL gives NULL</text>
<rect x="470.0" y="296.0" width="250.0" height="36.0" rx="8" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.4"/>
<text x="484.0" y="319.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="start">= NULL</text>
<text x="734.0" y="319.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc4c3a" text-anchor="start">WHERE drops the row</text>
<text x="470.0" y="368.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Same for 2 IN (1, NULL): NULL, not false.</text>
<line x1="40.0" y1="380.0" x2="960.0" y2="380.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="52.0" cy="406.0" r="12" fill="#1f2937"/>
<text x="52.0" y="411.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="74.0" y="412.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Three-valued logic: rows from the post's table</text>
<rect x="40.0" y="434.0" width="290.0" height="38.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="54.0" y="459.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">NULL = NULL</text>
<text x="316.0" y="459.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="end">→ NULL</text>
<rect x="355.0" y="434.0" width="290.0" height="38.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="369.0" y="459.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">true OR NULL</text>
<text x="631.0" y="459.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#16a34a" text-anchor="end">→ true</text>
<rect x="670.0" y="434.0" width="290.0" height="38.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="684.0" y="459.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">false OR NULL</text>
<text x="946.0" y="459.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="end">→ NULL</text>
<rect x="40.0" y="484.0" width="290.0" height="38.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="54.0" y="509.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">true AND NULL</text>
<text x="316.0" y="509.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="end">→ NULL</text>
<rect x="355.0" y="484.0" width="290.0" height="38.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="369.0" y="509.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">false AND NULL</text>
<text x="631.0" y="509.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="end">→ false</text>
<rect x="670.0" y="484.0" width="290.0" height="38.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="684.0" y="509.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">1 + NULL</text>
<text x="946.0" y="509.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="end">→ NULL</text>
<text x="40.0" y="550.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">A result that is already decided (true OR …, false AND …) ignores the NULL. Anything undecided stays NULL.</text>
<line x1="40.0" y1="560.0" x2="960.0" y2="560.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="52.0" cy="586.0" r="12" fill="#1f2937"/>
<text x="52.0" y="591.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="74.0" y="592.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">"Customers with no orders": if any orders.customer_id is NULL, NOT IN returns zero rows</text>
<circle cx="52" cy="619" r="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M48.0,619.0 l2.9,2.9 l5.2,-5.6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">1.</text>
<text x="92.0" y="624.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">NOT EXISTS (…)</text>
<text x="470.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">NULL-safe, usually the best plan (anti-join)</text>
<circle cx="52" cy="649" r="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<path d="M48.0,649.0 l2.9,2.9 l5.2,-5.6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72.0" y="654.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">2.</text>
<text x="92.0" y="654.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">LEFT JOIN … WHERE o.id IS NULL</text>
<text x="470.0" y="654.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">also NULL-safe</text>
<circle cx="52" cy="679" r="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<path d="M48.0,679.0 l2.9,2.9 l5.2,-5.6" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72.0" y="684.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">3.</text>
<text x="92.0" y="684.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">NOT IN (… WHERE customer_id IS NOT NULL)</text>
<text x="470.0" y="684.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">works, but fragile to future schema changes</text>
<text x="40.0" y="724.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: PostgreSQL Course 01, Chapter 4 (surprising-results table, the NOT IN trap and its three rewrites).</text>
</svg>