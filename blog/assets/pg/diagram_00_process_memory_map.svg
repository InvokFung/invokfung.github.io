<text x="656.0" y="401.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">reclaim dead row versions, refresh stats</text>
<rect x="642.0" y="422.0" width="304.0" height="54.0" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.3"/>
<text x="656.0" y="444.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">archiver</text>
<text x="656.0" y="464.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">copies finished WAL segments (for PITR)</text>
<rect x="642.0" y="485.0" width="304.0" height="54.0" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.3"/>
<text x="656.0" y="507.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">logical repl launcher</text>
<text x="656.0" y="527.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">starts apply workers for subscriptions</text>
<rect x="642.0" y="548.0" width="304.0" height="54.0" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.3"/>
<text x="656.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">io workers (PG 18)</text>
<text x="656.0" y="590.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">async reads when io_method = worker</text>
<line x1="40.0" y1="638.0" x2="960.0" y2="638.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<text x="40.0" y="664.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Memory settings: rough starting points from the post</text>
<circle cx="46" cy="687" r="5" fill="#0d9488"/>
<text x="58.0" y="692.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">shared_buffers</text>
<text x="180.8" y="692.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">cluster-wide · 25% of RAM on a dedicated server</text>
<circle cx="516" cy="687" r="5" fill="#0d9488"/>
<text x="528.0" y="692.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">wal_buffers</text>
<text x="626.2" y="692.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">cluster-wide · -1 = auto, 1/32 of shared_buffers</text>
<circle cx="46" cy="717" r="5" fill="#d97706"/>
<text x="58.0" y="722.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">work_mem</text>
<text x="131.6" y="722.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">per sort/hash node, per backend · 4–64 MB, workload dependent</text>
<circle cx="516" cy="717" r="5" fill="#d97706"/>
<text x="528.0" y="722.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">maintenance_work_mem</text>
<text x="700.0" y="722.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">per maintenance operation · 256 MB – 2 GB</text>
<text x="40.0" y="764.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc4c3a" text-anchor="start">Pitfall: work_mem is not a global budget. 3 hash joins across 4 parallel workers can ask for roughly 3 × 4 × work_mem.</text>
<text x="40.0" y="788.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: PostgreSQL Course 00, Chapter 4 (process map, auxiliary-process table, memory table).</text>
