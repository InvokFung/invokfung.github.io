<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 806" width="1000" height="806" role="img" aria-label="PostgreSQL process and memory map: a postmaster forks one backend per client connection; backends share shared memory; auxiliary processes flush buffers and WAL to disk; memory settings are either cluster-wide or per backend">
