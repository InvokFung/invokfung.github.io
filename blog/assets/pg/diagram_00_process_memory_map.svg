<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">One postmaster, one backend process per connection, one shared memory area, and a set of helper processes.</text>
