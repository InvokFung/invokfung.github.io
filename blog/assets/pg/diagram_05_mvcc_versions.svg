<text x="250.0" y="496.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">sees (0,1)  v = 'a'</text>
<circle cx="750" cy="456" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="750.0" y="440.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">snapshot taken after</text>
<rect x="640.0" y="474.0" width="220.0" height="34.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="750.0" y="496.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">sees (0,2)  v = 'b'</text>
<line x1="40.0" y1="522.0" x2="960.0" y2="522.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="52.0" cy="546.0" r="12" fill="#1f2937"/>
<text x="52.0" y="551.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="74.0" y="552.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">When the snapshot is taken: the post's Exercise 2</text>
<rect x="40.0" y="570.0" width="450.0" height="190.0" rx="10" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="56.0" y="596.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="start">READ COMMITTED (default)</text>
<text x="56.0" y="616.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">a new snapshot at the start of each statement</text>
<rect x="56.0" y="632.0" width="26.0" height="22.0" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="69.0" y="648.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
<text x="94.0" y="648.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">SELECT balance</text>
<text x="470.0" y="648.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="end">→ 1000</text>
