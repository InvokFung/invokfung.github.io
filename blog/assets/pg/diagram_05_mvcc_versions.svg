<text x="94.0" y="678.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">UPDATE … = 900; COMMIT</text>
<text x="470.0" y="678.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6b7280" text-anchor="end"></text>
<rect x="56.0" y="692.0" width="26.0" height="22.0" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="69.0" y="708.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
<text x="94.0" y="708.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">SELECT balance</text>
<text x="470.0" y="708.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#d97706" text-anchor="end">→ 900</text>
<text x="56.0" y="744.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="start">Non-repeatable read: the second SELECT changed.</text>
<rect x="510.0" y="570.0" width="450.0" height="190.0" rx="10" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="526.0" y="596.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">REPEATABLE READ</text>
<text x="526.0" y="616.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">one snapshot at the first statement, kept to the end</text>
<rect x="526.0" y="632.0" width="26.0" height="22.0" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="539.0" y="648.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
<text x="564.0" y="648.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">SELECT balance</text>
<text x="940.0" y="648.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#1f2937" text-anchor="end">→ 900</text>
<rect x="526.0" y="662.0" width="26.0" height="22.0" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
<text x="539.0" y="678.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="middle">B</text>
<text x="564.0" y="678.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">UPDATE … = 800; COMMIT</text>
<text x="940.0" y="678.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#6b7280" text-anchor="end"></text>
<rect x="526.0" y="692.0" width="26.0" height="22.0" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="539.0" y="708.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
<text x="564.0" y="708.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">SELECT balance</text>
<text x="940.0" y="708.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="end">→ 900</text>
<text x="526.0" y="744.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="start">Stable: still 900, B's 800 is not visible.</text>
<text x="40.0" y="796.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: PostgreSQL Course 05, Chapter 2 (ctid / xmin / xmax output, visibility rule) and Exercise 2.</text>
