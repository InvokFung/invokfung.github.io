<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-label="Three ways an event reaches a Lambda function: sync, async and polling">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="730" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="728.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Three ways an event reaches a Lambda</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">A Lambda runs only when an event source invokes it. The mode decides who waits and where failures go.</text>
<rect x="40.0" y="100.0" width="920.0" height="162.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="66.0" cy="125.0" r="12" fill="#0d9488"/>
<text x="66.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="86.0" y="131.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0d9488" text-anchor="start">Sync: the caller waits for the response</text>
<text x="940.0" y="131.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="end">API Gateway timeout 29 sec · Lambda payload 6 MB</text>
<rect x="64.0" y="148.0" width="190.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="80.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">Caller</text>
<text x="80.0" y="198.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">sends a request, waits</text>
<rect x="314.0" y="148.0" width="300.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="330.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">API Gateway / Function URL</text>
<text x="330.0" y="198.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">or a direct RequestResponse invoke</text>
<rect x="674.0" y="148.0" width="262.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="690.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">Lambda handler</text>
<text x="690.0" y="198.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">runs and returns a result</text>
<line x1="254.0" y1="180.0" x2="314.0" y2="180.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="614.0" y1="180.0" x2="674.0" y2="180.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M805,212 L805,238 L159,238 L159,214" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="400.0" y="226.0" width="200.0" height="24.0" rx="4" fill="#fbfbfc" stroke="#fbfbfc" stroke-width="0"/>
<text x="500.0" y="243.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#0d9488" text-anchor="middle">response back to the caller</text>
<rect x="40.0" y="278.0" width="920.0" height="162.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="66.0" cy="303.0" r="12" fill="#d97706"/>
<text x="66.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="86.0" y="309.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#d97706" text-anchor="start">Async: Lambda takes the event and returns at once</text>
<text x="940.0" y="309.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="end">Lambda payload 256 KB</text>
<rect x="64.0" y="326.0" width="190.0" height="64.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="80.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Event source</text>
<text x="80.0" y="376.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">S3 · SNS · EventBridge</text>
<rect x="314.0" y="326.0" width="250.0" height="64.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="330.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Lambda handler</text>
<text x="330.0" y="376.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">processes in the background</text>
<rect x="624.0" y="326.0" width="140.0" height="64.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="640.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706" text-anchor="start">Retried twice</text>
<text x="640.0" y="376.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">two more attempts</text>
<rect x="812.0" y="326.0" width="124.0" height="64.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<text x="828.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">DLQ</text>
<text x="828.0" y="376.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">optional</text>
<line x1="254.0" y1="358.0" x2="314.0" y2="358.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="564.0" y1="358.0" x2="624.0" y2="358.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="594.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc4c3a" text-anchor="middle">fails</text>
<line x1="764.0" y1="358.0" x2="812.0" y2="358.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M439,390 L439,416 L159,416 L159,392" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="299.0" y="436.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706" text-anchor="middle">returns immediately</text>
<text x="470.0" y="421.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">The source does not wait for the work to finish.</text>
<rect x="40.0" y="456.0" width="920.0" height="236.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="66.0" cy="481.0" r="12" fill="#7c3aed"/>
<text x="66.0" y="486.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="86.0" y="487.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#7c3aed" text-anchor="start">Polling: Lambda reads the queue in batches</text>
<text x="940.0" y="487.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="end">also Kinesis and DynamoDB Streams</text>
<rect x="64.0" y="504.0" width="190.0" height="64.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="80.0" y="532.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start">SQS queue</text>
<text x="80.0" y="554.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">producers send messages</text>
<rect x="344.0" y="504.0" width="250.0" height="64.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="360.0" y="532.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="start">Lambda handler</text>
<text x="360.0" y="554.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">up to 10 messages at once</text>
<rect x="684.0" y="504.0" width="252.0" height="64.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="700.0" y="532.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">Success</text>
<text x="700.0" y="554.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">message deleted from the queue</text>
<line x1="254.0" y1="536.0" x2="344.0" y2="536.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="299.0" y="528.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">polls</text>
<line x1="594.0" y1="536.0" x2="684.0" y2="536.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="469.0" y1="568.0" x2="469.0" y2="632.0" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round"/>
<circle cx="469" cy="632" r="4" fill="#dc4c3a"/>
<text x="479.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc4c3a" text-anchor="start">error</text>
<path d="M469,632 L159,632 L159,570" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="176.0" y="654.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The message is not deleted. It comes back after the visibility</text>
<text x="176.0" y="673.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">timeout (default 30 sec; set it to at least 2× processing time).</text>
<rect x="684.0" y="590.0" width="252.0" height="84.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<text x="700.0" y="615.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">DLQ</text>
<text x="700.0" y="637.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">after N receives (typical 3–5)</text>
<text x="700.0" y="658.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">alarm when DLQ count &gt; 0</text>
<line x1="469.0" y1="632.0" x2="684.0" y2="632.0" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="577.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#dc4c3a" text-anchor="middle">still failing</text>
<text x="40.0" y="712.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Numbers as given in the post: Chapter 3 (modes), Chapter 5 (SQS) and Chapter 9 (limits).</text>
</svg>