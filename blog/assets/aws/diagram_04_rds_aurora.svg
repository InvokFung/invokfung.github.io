<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 646" width="1000" height="646" role="img" aria-label="RDS with a Multi-AZ standby and a read replica, next to Aurora with instances sharing one cluster volume that keeps six copies across three AZs">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="646" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="644.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">RDS vs Aurora: where the copies live</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">RDS copies data from one instance to another. Aurora instances share one storage layer that keeps 6 copies.</text>
<defs><marker id="ah_teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0d9488"/></marker></defs>
<defs><marker id="ah_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker></defs>
<rect x="40.0" y="100.0" width="450.0" height="460.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#2563eb" text-anchor="start">RDS</text>
<text x="60.0" y="154.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Multi-AZ standby for HA, read replicas for reads</text>
<rect x="180.0" y="178.0" width="170.0" height="34.0" rx="17" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
<text x="265.0" y="201.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">your app</text>
<rect x="165.0" y="252.0" width="200.0" height="66.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="265.0" y="279.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="middle">Primary</text>
<text x="265.0" y="301.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">EC2 + EBS, managed by AWS</text>
<line x1="265.0" y1="212.0" x2="265.0" y2="249.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="255.0" y="238.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="end">writes + reads</text>
<rect x="56.0" y="392.0" width="196.0" height="122.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="70.0" y="418.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="start">Standby</text>
<text x="70.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">in another AZ</text>
<text x="70.0" y="461.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">invisible to the app</text>
<text x="70.0" y="480.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">automatic failover</text>
<text x="70.0" y="499.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">in 60-120 sec</text>
<rect x="278.0" y="392.0" width="196.0" height="122.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="292.0" y="418.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#d97706" text-anchor="start">Read replica</text>
<text x="292.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">queryable endpoint</text>
<text x="292.0" y="461.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">writes fail here</text>
<text x="292.0" y="480.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">manual promote</text>
<text x="292.0" y="499.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">up to 15</text>
<line x1="205.0" y1="318.0" x2="154.0" y2="389.0" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ah_teal)"/>
<text x="175.0" y="352.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="end">synchronous</text>
<line x1="325.0" y1="318.0" x2="376.0" y2="389.0" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#ah_amber)"/>
<text x="355.0" y="352.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="start">asynchronous</text>
<path d="M350.0,195.0 L448.0,195.0 Q458.0,195.0 458.0,205.0 L458.0,389.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="450.0" y="290.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="end">reads only</text>
<text x="60.0" y="540.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Cost: Multi-AZ = 2× the instance; each replica = 1×.</text>
<rect x="510.0" y="100.0" width="450.0" height="460.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="530.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#7c3aed" text-anchor="start">Aurora</text>
<text x="530.0" y="154.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Instances share one cluster volume across 3 AZs</text>
<rect x="530.0" y="178.0" width="128.0" height="58.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="594.0" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">Primary</text>
<text x="594.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">writes + reads</text>
<rect x="671.0" y="178.0" width="128.0" height="58.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="735.0" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#d97706" text-anchor="middle">Read replica</text>
<text x="735.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">reads</text>
<rect x="812.0" y="178.0" width="128.0" height="58.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="876.0" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#d97706" text-anchor="middle">Read replica</text>
<text x="876.0" y="223.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">reads</text>
<line x1="594.0" y1="236.0" x2="594.0" y2="283.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="735.0" y1="236.0" x2="735.0" y2="283.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="876.0" y1="236.0" x2="876.0" y2="283.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="530.0" y="286.0" width="410.0" height="150.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="735.0" y="312.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Shared cluster volume</text>
<rect x="550.0" y="326" width="118.0" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="609.0" y="348.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">AZ a</text>
<rect x="566.0" y="360.0" width="38.0" height="40.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="585.0" y="385.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">1</text>
<rect x="614.0" y="360.0" width="38.0" height="40.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="633.0" y="385.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">2</text>
