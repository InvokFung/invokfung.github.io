<rect x="802.0" y="326" width="118.0" height="96" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="861.0" y="348.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">AZ c</text>
<rect x="818.0" y="360.0" width="38.0" height="40.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="837.0" y="385.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">5</text>
<rect x="866.0" y="360.0" width="38.0" height="40.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="885.0" y="385.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">6</text>
<text x="530.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">6 copies in 3 AZs: writes keep working after losing</text>
<text x="530.0" y="482.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">up to 2 copies, reads after losing up to 3.</text>
<text x="530.0" y="502.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Auto-grows in 10 GB chunks up to 128 TB.</text>
<text x="530.0" y="522.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Up to 15 read replicas; lag in single-digit ms.</text>
<text x="40.0" y="596.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2937" text-anchor="start">Production = always Multi-AZ. Heavy-read workloads = also one or more read replicas.</text>
<text x="40.0" y="628.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Figures as given in the post (RDS and Aurora chapters, Exercise 2).</text>
</svg>