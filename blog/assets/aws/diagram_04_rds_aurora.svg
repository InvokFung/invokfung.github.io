<text x="735.0" y="348.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle">AZ b</text>
<rect x="692.0" y="360.0" width="38.0" height="40.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="711.0" y="385.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">3</text>
<rect x="740.0" y="360.0" width="38.0" height="40.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
