<text x="320.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">14°</text>
<circle cx="500" cy="170" r="34" fill="#f2c418" stroke="#8a6d00" stroke-width="2"/>
<circle cx="534.0" cy="170" r="34" fill="#ffffff" fill-opacity="0.55" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="534.0" y1="124" x2="534.0" y2="216" stroke="#2563eb" stroke-width="2"/>
<text x="520.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">½ ball</text>
<line x1="450.0" y1="400.0" x2="560.0" y2="400.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="450.0" y1="400.0" x2="545.3" y2="345.0" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M496.0,400.0 A46,46 0 0 0 489.8,377.0" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="450" cy="400" r="9" fill="#f2c418" stroke="#8a6d00" stroke-width="1.5"/>
<text x="510.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">30°</text>
<circle cx="690" cy="170" r="34" fill="#f2c418" stroke="#8a6d00" stroke-width="2"/>
<circle cx="741.0" cy="170" r="34" fill="#ffffff" fill-opacity="0.55" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="741.0" y1="124" x2="741.0" y2="216" stroke="#2563eb" stroke-width="2"/>
<text x="710.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">¼ ball</text>
<line x1="640.0" y1="400.0" x2="750.0" y2="400.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="640.0" y1="400.0" x2="712.8" y2="317.5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M686.0,400.0 A46,46 0 0 0 670.4,365.5" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
