<line x1="939.5" y1="124" x2="939.5" y2="216" stroke="#2563eb" stroke-width="2"/>
<text x="900.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">⅛ ball</text>
<line x1="830.0" y1="400.0" x2="940.0" y2="400.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="830.0" y1="400.0" x2="883.3" y2="303.8" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M876.0,400.0 A46,46 0 0 0 852.3,359.8" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="830" cy="400" r="9" fill="#f2c418" stroke="#8a6d00" stroke-width="1.5"/>
<text x="890.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#d97706" text-anchor="middle">61°</text>
<text x="40.0" y="262.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Blue line = where the white's centre points. Half ball: it points at the yellow's edge.</text>
<text x="40.0" y="290.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">From above: the yellow's path (orange) and the white's line (grey).</text>
<text x="40.0" y="482.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">cut = arcsin(1 − fraction covered). ¾ = 14.5°, ½ = 30°, ¼ = 48.6°, ⅛ = 61.0°.</text>
</svg>