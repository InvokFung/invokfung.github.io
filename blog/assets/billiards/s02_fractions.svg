<circle cx="310" cy="170" r="34" fill="#f2c418" stroke="#8a6d00" stroke-width="2"/>
<circle cx="327.0" cy="170" r="34" fill="#ffffff" fill-opacity="0.55" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="327.0" y1="124" x2="327.0" y2="216" stroke="#2563eb" stroke-width="2"/>
<text x="330.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">¾ ball</text>
<line x1="260.0" y1="400.0" x2="370.0" y2="400.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
