<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Five columns: full, three-quarter, half, quarter and one-eighth ball. Top: the view down the cue, the see-through white covering all, three quarters, half, a quarter or an eighth of the yellow. Bottom: from above, the yellow leaves at 0, 14, 30, 49 and 61 degrees from the white's line">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="500" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="498.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">How much of the ball you cover sets the cut angle</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Down the cue (top) and from above (bottom). Exact geometry for a stun or slow shot, before throw.</text>
<circle cx="120" cy="170" r="34" fill="#f2c418" stroke="#8a6d00" stroke-width="2"/>
<circle cx="120.0" cy="170" r="34" fill="#ffffff" fill-opacity="0.55" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="120.0" y1="124" x2="120.0" y2="216" stroke="#2563eb" stroke-width="2"/>
<text x="140.0" y="108.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">full ball</text>
<line x1="70.0" y1="400.0" x2="180.0" y2="400.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="70.0" y1="400.0" x2="180.0" y2="400.0" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<circle cx="70" cy="400" r="9" fill="#f2c418" stroke="#8a6d00" stroke-width="1.5"/>
