<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Three small tables. 1: the white far from the reds. 2: the white close to a cushion. 3: the white hidden behind a colour, so no red can be hit directly">
