<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Three rows. A straight red 50 cm from a corner pocket, the white 30, 80 or 150 cm behind it. A green wedge from the white shows how far the aim may turn and still pot: 2.2, 0.72 and 0.36 degrees. Wedges drawn ten times wider">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="520" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="518.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Further back, the same pot needs a straighter cue</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Straight red 50 cm from the corner pocket, medium pace. Simulated room to pot.</text>
<path d="M690.0,160 L792.1,140.2 L792.1,179.8 Z" fill="#2f9e6b" fill-opacity="0.28" stroke="none"/>
<line x1="780.0" y1="160.0" x2="916.0" y2="160.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="930" cy="160" r="15" fill="#222"/>
<circle cx="780.0" cy="160" r="8" fill="#d42a2a" stroke="#7a1010" stroke-width="1.5"/>
<circle cx="690.0" cy="160" r="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<circle cx="40.0" cy="160.0" r="12" fill="#d97706"/>
<text x="40.0" y="165.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="70.0" y="138.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">White 30 cm behind</text>
<text x="70.0" y="162.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">aim room 2.20°</text>
<text x="70.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">≈ 12 mm across at the red</text>
<path d="M540.0,280 L793.5,264.1 L793.5,295.9 Z" fill="#2f9e6b" fill-opacity="0.28" stroke="none"/>
<line x1="780.0" y1="280.0" x2="916.0" y2="280.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="930" cy="280" r="15" fill="#222"/>
<circle cx="780.0" cy="280" r="8" fill="#d42a2a" stroke="#7a1010" stroke-width="1.5"/>
<circle cx="540.0" cy="280" r="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<circle cx="40.0" cy="280.0" r="12" fill="#d97706"/>
<text x="40.0" y="285.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="70.0" y="258.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">White 80 cm behind</text>
<text x="70.0" y="282.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">aim room 0.72°</text>
<text x="70.0" y="304.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">≈ 10 mm across at the red</text>
<path d="M330.0,400 L793.8,385.4 L793.8,414.6 Z" fill="#2f9e6b" fill-opacity="0.28" stroke="none"/>
<line x1="780.0" y1="400.0" x2="916.0" y2="400.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="930" cy="400" r="15" fill="#222"/>
<circle cx="780.0" cy="400" r="8" fill="#d42a2a" stroke="#7a1010" stroke-width="1.5"/>
<circle cx="330.0" cy="400" r="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<circle cx="40.0" cy="400.0" r="12" fill="#d97706"/>
<text x="40.0" y="405.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="70.0" y="378.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">White 150 cm behind</text>
<text x="70.0" y="402.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">aim room 0.36°</text>
<text x="70.0" y="424.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">≈ 9 mm across at the red</text>
<text x="40.0" y="472.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">The room at the red stays about 1 cm. From further back, 1 cm is a smaller turn of the cue.</text>
<text x="40.0" y="502.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Simulated: red 500 mm from the top-right pocket on the 45° line, pace level 3, aim turned in 0.02° steps. Wedges ×10.</text>
</svg>