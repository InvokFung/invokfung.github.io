<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Three boxes. Ahead by more than the points left: your opponent needs snookers, play safe. Close: play your normal game. Behind by more than the points left: you need snookers. Below, the points left with only the colours: 27 from the yellow, 25 green, 22 brown, 18 blue, 13 pink, 7 black">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="520" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="518.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Ahead or behind?</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Compare the gap in the score with the points left on the table.</text>
<rect x="40.0" y="120.0" width="296.0" height="150.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="56.0" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#16a34a" text-anchor="start">Ahead by more</text>
<text x="56.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">than the points left:</text>
<text x="56.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">your opponent needs snookers.</text>
<text x="56.0" y="214.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Play safe, take easy pots,</text>
<text x="56.0" y="236.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">keep balls off cushions.</text>
<rect x="352.0" y="120.0" width="296.0" height="150.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="368.0" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start">Close</text>
<text x="368.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">the gap is less than</text>
<text x="368.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">the points left.</text>
<text x="368.0" y="214.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Play your normal game:</text>
<text x="368.0" y="236.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">pot when the odds are good.</text>
<rect x="664.0" y="120.0" width="296.0" height="150.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<text x="680.0" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#dc4c3a" text-anchor="start">Behind by more</text>
<text x="680.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">than the points left:</text>
<text x="680.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">you need snookers.</text>
<text x="680.0" y="214.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Lay snookers, mostly on</text>
<text x="680.0" y="236.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">the last colours.</text>
<text x="40.0" y="320.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Points left = reds × 8 + 27   (3 reds: 51)</text>
<text x="40.0" y="352.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Only colours left: the points left from the colour on</text>
<circle cx="90" cy="410" r="20" fill="#e9c21a" stroke="#222"/>
<text x="90.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">27</text>
<circle cx="240" cy="410" r="20" fill="#127a3a" stroke="#222"/>
<text x="240.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">25</text>
<circle cx="390" cy="410" r="20" fill="#6b3b1c" stroke="#222"/>
<text x="390.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">22</text>
<circle cx="540" cy="410" r="20" fill="#1f5fd6" stroke="#222"/>
<text x="540.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">18</text>
<circle cx="690" cy="410" r="20" fill="#f08aa8" stroke="#222"/>
<text x="690.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">13</text>
<circle cx="840" cy="410" r="20" fill="#141414" stroke="#222"/>
<text x="840.0" y="462.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">7</text>
<text x="40.0" y="502.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Rules: WPBSA Official Rules 2024-25, Section 3 Rule 3. The plans in the boxes are coaching advice.</text>
</svg>