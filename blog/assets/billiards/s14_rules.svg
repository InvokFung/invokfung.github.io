<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Two side-view sketches. Left: the white leaves the cloth and passes over a red: a jump shot, a foul. Right: the white almost touching a red; the tip still on the white when it meets the red: a push stroke, a foul; a very fine edge is allowed">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="470" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="468.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Two fouls to know</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Both are about the cue and the white, not the balls you hit.</text>
<line x1="40.0" y1="330.0" x2="470.0" y2="330.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<circle cx="90" cy="308" r="22" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="260" cy="308" r="22" fill="#d42a2a" stroke="#7a1010" stroke-width="1.5"/>
<path d="M90,308 Q260,170 420,308" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<circle cx="260" cy="238" r="22" fill="#fff" stroke="#555" stroke-width="1.5"/>
<circle cx="440" cy="150" r="12" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M435.4,145.4 L444.6,154.6 M444.6,145.4 L435.4,154.6" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40.0" y="380.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Jump shot: the white passes over any part of</text>
<text x="40.0" y="402.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">a ball. Foul: the value of the ball on, at least 4.</text>
<line x1="530.0" y1="330.0" x2="960.0" y2="330.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<circle cx="700" cy="308" r="22" fill="#fff" stroke="#555" stroke-width="1.5"/>
<circle cx="746" cy="308" r="22" fill="#d42a2a" stroke="#7a1010" stroke-width="1.5"/>
<line x1="540.0" y1="290.0" x2="676.0" y2="306.0" stroke="#b08350" stroke-width="8" stroke-linecap="round"/>
<circle cx="930" cy="150" r="12" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<path d="M925.4,145.4 L934.6,154.6 M934.6,145.4 L925.4,154.6" fill="none" stroke="#dc4c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="530.0" y="380.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Push stroke: the tip still touches the white when</text>
<text x="530.0" y="402.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">it meets the red. A very fine edge is allowed.</text>
<text x="40.0" y="452.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">WPBSA Official Rules 2024-25: Section 2 Rules 19 and 20; Section 3 Rule 11. Not to scale.</text>
</svg>