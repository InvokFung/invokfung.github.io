<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Right side half-way to the edge, cue 5°, aimed straight. Above the line = right, below = left.</text>
