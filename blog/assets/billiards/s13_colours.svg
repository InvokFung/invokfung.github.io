<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="A table with the six colours on their spots and arrows showing the order: yellow, green, brown in the D, then the blue in the middle, the pink and the black at the top end. Short notes give a usual pocket for each">
