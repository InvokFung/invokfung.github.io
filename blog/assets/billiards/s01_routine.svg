<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Six steps of a pre-shot routine in a row: chalk, see the line from behind the white, put the cue on the line, feather, pause at the back with the eyes on the object ball, strike through the white and hold still">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="300" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="298.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">A pre-shot routine: the same six steps every time</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The same order and rhythm on every shot makes the stroke repeatable.</text>
<rect x="40.0" y="110.0" width="140.0" height="140.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<circle cx="64.0" cy="136.0" r="12" fill="#0d9488"/>
<text x="64.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="84.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Chalk</text>
<text x="54.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the tip, every</text>
<text x="54.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">shot or two</text>
<line x1="181.0" y1="180.0" x2="194.0" y2="180.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="195.0" y="110.0" width="140.0" height="140.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<circle cx="219.0" cy="136.0" r="12" fill="#0d9488"/>
<text x="219.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="239.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">See the line</text>
<text x="209.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">from behind:</text>
<text x="209.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">white to ghost ball</text>
<line x1="336.0" y1="180.0" x2="349.0" y2="180.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="350.0" y="110.0" width="140.0" height="140.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<circle cx="374.0" cy="136.0" r="12" fill="#0d9488"/>
<text x="374.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="394.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Cue on the line</text>
<text x="364.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the tip just behind</text>
<text x="364.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the white</text>
<line x1="491.0" y1="180.0" x2="504.0" y2="180.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="505.0" y="110.0" width="140.0" height="140.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<circle cx="529.0" cy="136.0" r="12" fill="#0d9488"/>
<text x="529.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="549.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Feather</text>
<text x="519.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">2–4 slow practice</text>
<text x="519.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">strokes</text>
<line x1="646.0" y1="180.0" x2="659.0" y2="180.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="660.0" y="110.0" width="140.0" height="140.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<circle cx="684.0" cy="136.0" r="12" fill="#d97706"/>
<text x="684.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="704.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Pause</text>
<text x="674.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">at the back:</text>
<text x="674.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">eyes on the red</text>
<line x1="801.0" y1="180.0" x2="814.0" y2="180.0" stroke="#6b7280" stroke-width="2" stroke-linecap="round" marker-end="url(#ahm)"/>
<rect x="815.0" y="110.0" width="140.0" height="140.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<circle cx="839.0" cy="136.0" r="12" fill="#0d9488"/>
<text x="839.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="859.0" y="141.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Strike</text>
<text x="829.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">through the white;</text>
<text x="829.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">hold still after</text>
<text x="40.0" y="282.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">The count of feathers is yours; keep it the same every time.</text>
</svg>