<text x="40.0" y="330.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">• Each lane is the white's path to just touch one edge of the red (dashed circle). Green = clear,</text>
<text x="40.0" y="356.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">   red = a ball not on is in the way.</text>
<text x="40.0" y="382.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">• Two balls in the way: the one nearer the white is the snookering ball.</text>
<text x="40.0" y="408.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">• A cushion never snookers you; only balls do.</text>
<text x="40.0" y="452.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">WPBSA Rules 2024-25, Section 2 Rule 17 (Snookered). Lanes drawn to scale: the white 60 cm from the red.</text>
