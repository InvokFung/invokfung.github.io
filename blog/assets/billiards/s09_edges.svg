<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Three small top views of the white, a blue and a red. Two shaded lanes show the white's path to just touch each edge of the red. 1: the blue blocks both lanes: snookered. 2: the blue blocks one lane: still snookered. 3: both lanes are clear: not snookered">
