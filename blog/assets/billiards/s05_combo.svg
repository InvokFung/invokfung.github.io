<circle cx="250" cy="260" r="65.0" fill="#2f9e6b" fill-opacity="0.12" stroke="#2f9e6b" stroke-dasharray="6 5"/>
<circle cx="250.0" cy="260.0" r="13" fill="#2f6fd6"/>
<text x="250.0" y="264.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<circle cx="250.0" cy="201.5" r="13" fill="#2f6fd6"/>
<text x="250.0" y="206.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
<circle cx="250.0" cy="318.5" r="13" fill="#2f6fd6"/>
<text x="250.0" y="323.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<circle cx="191.5" cy="260.0" r="13" fill="#2f6fd6"/>
<text x="191.5" y="264.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">L</text>
<circle cx="308.5" cy="260.0" r="13" fill="#2f6fd6"/>
<text x="308.5" y="264.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
<circle cx="209.1" cy="219.1" r="13" fill="#2f6fd6"/>
<text x="209.1" y="223.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">TL</text>
<circle cx="290.9" cy="219.1" r="13" fill="#2f6fd6"/>
<text x="290.9" y="223.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">TR</text>
<circle cx="209.1" cy="300.9" r="13" fill="#2f6fd6"/>
<text x="209.1" y="305.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">BL</text>
<circle cx="290.9" cy="300.9" r="13" fill="#2f6fd6"/>
<text x="290.9" y="305.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">BR</text>
<text x="450.0" y="160.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="start">C</text>
<text x="530.0" y="160.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">centre</text>
<text x="530.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">plain</text>
<text x="450.0" y="212.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="start">T / B</text>
<text x="530.0" y="212.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">top / bottom</text>
<text x="530.0" y="232.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">follow / screw</text>
<text x="450.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="start">L / R</text>
<text x="530.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">left / right</text>
<text x="530.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">side only</text>
<text x="450.0" y="316.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="start">TL / TR</text>
<text x="530.0" y="316.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">top left / top right</text>
<text x="530.0" y="336.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">follow + side: runs on, then side off the cushion</text>
<text x="450.0" y="368.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="start">BL / BR</text>
<text x="530.0" y="368.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">bottom left / bottom right</text>
<text x="530.0" y="388.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">screw + side: comes back, then side off the cushion</text>
<text x="40.0" y="422.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Corner spots still squirt and throw like plain side. Keep them inside the safe zone.</text>
</svg>