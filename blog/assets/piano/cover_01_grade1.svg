<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Treble and bass clef on staff">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3a5a"/>
      <stop offset="100%" stop-color="#1d6a8a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg1)"/>
  <circle cx="1000" cy="500" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="180" cy="120" r="160" fill="#ffffff" opacity="0.04"/>

  <!-- staff lines, treble + bass on grand staff -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.85">
    <line x1="350" y1="200" x2="950" y2="200"/>
    <line x1="350" y1="230" x2="950" y2="230"/>
    <line x1="350" y1="260" x2="950" y2="260"/>
    <line x1="350" y1="290" x2="950" y2="290"/>
    <line x1="350" y1="320" x2="950" y2="320"/>

    <line x1="350" y1="400" x2="950" y2="400"/>
    <line x1="350" y1="430" x2="950" y2="430"/>
    <line x1="350" y1="460" x2="950" y2="460"/>
    <line x1="350" y1="490" x2="950" y2="490"/>
    <line x1="350" y1="520" x2="950" y2="520"/>
  </g>
  <!-- brace -->
  <path d="M 340 200 Q 320 260 340 320 Q 340 360 340 400 Q 320 460 340 520" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.9"/>

  <!-- treble clef (stylised glyph) -->
  <g transform="translate(380 175) scale(2.6)" fill="#ffd966">
    <path d="M 20 0 C 14 -8 0 -8 0 6 C 0 22 14 28 22 32 C 30 36 36 42 36 52 C 36 62 28 70 18 70 C 8 70 0 62 0 52 C 0 46 4 42 10 42 C 14 42 18 46 18 50 C 18 53 16 56 12 56 C 11 56 10 56 10 56 C 11 58 13 60 16 60 C 22 60 26 56 26 50 C 26 42 18 36 10 36 C 4 36 -2 32 -2 22 C -2 8 12 -2 22 0 Z"/>
    <circle cx="18" cy="60" r="4"/>
  </g>
  <text x="430" y="350" fill="#ffd966" font-family="Georgia, serif" font-size="22" font-style="italic">Treble (RH)</text>

  <!-- bass clef -->
  <g transform="translate(380 380) scale(2.3)" fill="#9be3c8">
    <path d="M 0 10 C 0 0 10 -6 22 -6 C 36 -6 46 6 46 22 C 46 40 30 56 6 64 L 6 60 C 24 52 36 38 36 22 C 36 12 30 4 22 4 C 14 4 8 10 8 16 C 8 20 12 24 16 24 C 20 24 24 20 24 16 L 24 16"/>
    <circle cx="52" cy="4" r="4"/>
    <circle cx="52" cy="22" r="4"/>
  </g>
  <text x="430" y="555" fill="#9be3c8" font-family="Georgia, serif" font-size="22" font-style="italic">Bass (LH)</text>

  <!-- middle C ledger line + note -->
  <line x1="640" y1="360" x2="700" y2="360" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="670" cy="360" rx="14" ry="10" fill="#ff8a65"/>
  <text x="720" y="368" fill="#ff8a65" font-family="Georgia, serif" font-size="22">Middle C</text>

  <!-- title -->
  <text x="100" y="100" fill="#ffffff" font-family="Georgia, serif" font-size="64" font-weight="600">Piano · 01</text>
  <text x="100" y="148" fill="#c8efff" font-family="Georgia, serif" font-size="32" font-style="italic">Grade 1 Theory</text>
</svg>
