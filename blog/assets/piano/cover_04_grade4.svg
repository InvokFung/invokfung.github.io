<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Circle of fifths with cadence arrows">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a14"/>
      <stop offset="100%" stop-color="#6a3e1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- circle of fifths -->
  <g transform="translate(800 315)">
    <circle r="220" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <circle r="150" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

    <g font-family="Georgia, serif" font-size="32" font-weight="700" text-anchor="middle" fill="#ffffff">
      <text x="0"    y="-180">C</text>
      <text x="110"  y="-145">G</text>
      <text x="190"  y="-65">D</text>
      <text x="210"  y="40">A</text>
      <text x="160"  y="130">E</text>
      <text x="80"   y="195">B</text>
      <text x="-80"  y="195">F♯</text>
      <text x="-160" y="130">D♭</text>
      <text x="-210" y="40">A♭</text>
      <text x="-190" y="-65">E♭</text>
      <text x="-110" y="-145">B♭</text>
      <text x="0"    y="-110" font-size="22" opacity="0.75">F</text>
    </g>

    <!-- inner labels: relative minors -->
    <g font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#ffd966">
      <text x="0"    y="-90">a m</text>
      <text x="70"   y="-65">e m</text>
      <text x="95"   y="0">b m</text>
      <text x="80"   y="55">f♯ m</text>
      <text x="40"   y="95">c♯ m</text>
      <text x="-40"  y="95">a♭ m</text>
      <text x="-80"  y="55">e♭ m</text>
      <text x="-95"  y="0">b♭ m</text>
      <text x="-70"  y="-65">g m</text>
      <text x="-40"  y="-100">d m</text>
    </g>

    <!-- pointer marking V→I cadence arrow from G to C -->
    <path d="M 95 -125 Q 60 -180 5 -160" stroke="#ff8a65" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a65"/>
    </marker>
  </defs>

  <!-- decorative cadence text -->
  <text x="100" y="380" fill="#ff8a65" font-family="Georgia, serif" font-size="40" font-weight="700">V → I</text>
  <text x="100" y="420" fill="#fce7c8" font-family="Georgia, serif" font-size="22" font-style="italic">perfect cadence</text>

  <!-- title -->
  <text x="100" y="120" fill="#ffffff" font-family="Georgia, serif" font-size="64" font-weight="600">Piano · 04</text>
  <text x="100" y="168" fill="#fce7c8" font-family="Georgia, serif" font-size="32" font-style="italic">Grade 4 — Keys &amp; Cadences</text>
</svg>
