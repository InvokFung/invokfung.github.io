<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Piano keyboard with grand piano silhouette">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#3d2952"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f5"/>
      <stop offset="100%" stop-color="#cfcfc8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft circle accents -->
  <circle cx="950" cy="120" r="180" fill="#ffffff" opacity="0.04"/>
  <circle cx="180" cy="540" r="220" fill="#ffffff" opacity="0.03"/>

  <!-- grand piano silhouette top half -->
  <g transform="translate(600 330)" opacity="0.18" fill="#ffffff">
    <path d="M -240 -60 Q -160 -160 0 -160 Q 200 -160 240 -40 L 240 80 L -240 80 Z"/>
    <circle cx="-160" cy="100" r="22"/>
    <circle cx="180" cy="100" r="22"/>
  </g>

  <!-- keyboard row -->
  <g transform="translate(180 380)">
    <!-- 14 white keys = 2 octaves -->
    <g>
      <rect x="0"   y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="60"  y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="120" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="180" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="240" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="300" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="360" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="420" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="480" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="540" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="600" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="660" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="720" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
      <rect x="780" y="0" width="60" height="200" fill="url(#key)" stroke="#888" stroke-width="1.5" rx="2"/>
    </g>
    <!-- black keys: C# D#, F# G# A#, repeat -->
    <g fill="#0e0e14">
      <rect x="42"  y="0" width="36" height="125" rx="2"/>
      <rect x="102" y="0" width="36" height="125" rx="2"/>
      <rect x="222" y="0" width="36" height="125" rx="2"/>
      <rect x="282" y="0" width="36" height="125" rx="2"/>
      <rect x="342" y="0" width="36" height="125" rx="2"/>
      <rect x="462" y="0" width="36" height="125" rx="2"/>
      <rect x="522" y="0" width="36" height="125" rx="2"/>
      <rect x="642" y="0" width="36" height="125" rx="2"/>
      <rect x="702" y="0" width="36" height="125" rx="2"/>
      <rect x="762" y="0" width="36" height="125" rx="2"/>
    </g>
    <!-- middle-C marker -->
    <circle cx="30" cy="250" r="10" fill="#7adfd0"/>
    <text x="30" y="290" fill="#7adfd0" font-family="Georgia, serif" font-size="22" text-anchor="middle">C4</text>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text x="100" y="180" fill="#ffffff" font-family="Georgia, serif" font-size="76" font-weight="600">Piano · 00</text>
    <text x="100" y="240" fill="#c4c8e8" font-family="Georgia, serif" font-size="34" font-style="italic">Beginner Basics</text>
  </g>
</svg>
