<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Timeline on one main thread: a transition render of a large list runs in time slices, a keystroke in SyncLane interrupts it and is rendered and committed at once, then the transition restarts with the newest query and commits">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="560" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="558.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">An urgent update interrupts a Transition</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">One main thread. React yields between slices, so a keystroke never waits for the whole list render.</text>
<text x="40.0" y="172.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#dc4c3a" text-anchor="start">SyncLane</text>
<text x="40.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">keystroke (input)</text>
<text x="40.0" y="272.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">TransitionLanes</text>
<text x="40.0" y="292.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">list render</text>
<line x1="200.0" y1="210.0" x2="960.0" y2="210.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<line x1="200.0" y1="310.0" x2="960.0" y2="310.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>
<rect x="200.0" y="154.0" width="110.0" height="50.0" rx="7" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<text x="255.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="middle">type 'r'</text>
<text x="255.0" y="194.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">render + commit</text>
<rect x="322.0" y="254.0" width="60.0" height="50.0" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="352.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">slice</text>
<rect x="392.0" y="254.0" width="60.0" height="50.0" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="422.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">slice</text>
<rect x="462.0" y="254.0" width="60.0" height="50.0" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="492.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">slice</text>
<path d="M536,258 L556,300 M556,258 L536,300" fill="none" stroke="#dc4c3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="546.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="middle">abandoned</text>
<rect x="566.0" y="154.0" width="120.0" height="50.0" rx="7" fill="#fef2f2" stroke="#dc4c3a" stroke-width="1.8"/>
<text x="626.0" y="176.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc4c3a" text-anchor="middle">type 're'</text>
<text x="626.0" y="194.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">render + commit</text>
<rect x="698.0" y="254.0" width="60.0" height="50.0" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="728.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">slice</text>
<rect x="768.0" y="254.0" width="60.0" height="50.0" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="798.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">slice</text>
<rect x="838.0" y="254.0" width="60.0" height="50.0" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<text x="868.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">slice</text>
<rect x="908.0" y="254.0" width="52.0" height="50.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="934.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">commit</text>
<text x="798.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">restart with 're'</text>
<text x="385.0" y="244.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">yield</text>
<text x="455.0" y="244.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="middle">yield</text>
<line x1="200.0" y1="370.0" x2="960.0" y2="370.0" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="960.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">time</text>
<circle cx="52.0" cy="415.0" r="12" fill="#d97706"/>
<text x="52.0" y="420.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="74.0" y="420.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The user types; the big list re-renders as a Transition, in slices.</text>
<circle cx="52.0" cy="443.0" r="12" fill="#d97706"/>
<text x="52.0" y="448.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="74.0" y="448.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The next keystroke arrives: React pauses (or abandons) the list render at the next yield point.</text>
<circle cx="52.0" cy="471.0" r="12" fill="#d97706"/>
<text x="52.0" y="476.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="74.0" y="476.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The input change is rendered and committed synchronously: the character appears at once.</text>
<circle cx="52.0" cy="499.0" r="12" fill="#d97706"/>
<text x="52.0" y="504.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="74.0" y="504.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">The list render restarts with the newest query and commits later.</text>
<circle cx="255.0" cy="132.0" r="12" fill="#d97706"/>
<text x="255.0" y="137.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="546.0" cy="232.0" r="12" fill="#d97706"/>
<text x="546.0" y="237.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="626.0" cy="132.0" r="12" fill="#d97706"/>
<text x="626.0" y="137.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="798.0" cy="232.0" r="12" fill="#d97706"/>
<text x="798.0" y="237.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="40.0" y="542.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: this post, Chapters 1 and 2. Slice lengths are schematic, not to scale.</text>
</svg>