<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 626" width="1000" height="626" role="img" aria-label="Anatomy of a Cache Components page: a prerendered static shell containing the layout and cached content, dynamic holes behind Suspense boundaries for cookie-based and uncached data, and the order in which they reach the browser">
