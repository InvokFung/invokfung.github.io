<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-label="A ref feeds a computed and several effects through track and trigger; after a write, a sync watcher runs inside the write, and one microtask flush then runs pre watchers and component updates sorted by id, patches the DOM, runs post watchers and hooks, and resolves nextTick">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="790" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="788.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">From a write to the DOM</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Reads link effects to deps (track). A write notifies them (trigger). The scheduler batches the work.</text>
<text x="40.0" y="112.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">1 · The dependency graph</text>
