<text x="40.0" y="390.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Each arrow was created by track(): the effect read the dep during its last run. A branch not taken creates no link.</text>
