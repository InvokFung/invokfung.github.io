<text x="56.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">a dep: .value</text>
<rect x="290.0" y="134.0" width="210.0" height="84.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
