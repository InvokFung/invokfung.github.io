<text x="40.0" y="434.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">2 · One tick after count.value++</text>
<text x="40.0" y="456.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Checked log order on Vue 3.5:  sync, after set, pre, post</text>
