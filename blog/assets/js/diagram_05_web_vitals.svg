<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Core Web Vitals thresholds at the 75th percentile: LCP good up to 2.5 s, poor above 4.0 s; INP good up to 200 ms, poor above 500 ms; CLS good up to 0.1, poor above 0.25. LCP splits into time to first byte, resource load delay, resource load duration and element render delay. INP splits into input delay, processing duration and presentation delay.">
