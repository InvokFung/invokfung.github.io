<text x="40.0" y="572.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Promise.all and Promise.race stop waiting at 20 ms, but A and C keep running and their results are thrown away.</text>
<text x="40.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">To stop them, pass one AbortSignal to every input and abort it when the combinator settles (Chapter 4).</text>
<text x="40.0" y="622.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: JavaScript Deep Dive 03, Chapter 1 (the four combinators, worked example).</text>
