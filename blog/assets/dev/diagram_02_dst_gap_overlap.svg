<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" width="1000" height="584" role="img" aria-label="DST in New York in 2026: on 8 March local 02:00 to 02:59 never happens; on 1 November local 01:00 to 01:59 happens twice">
