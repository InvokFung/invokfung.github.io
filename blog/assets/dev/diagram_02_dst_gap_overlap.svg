<rect x="0.75" y="0.75" width="998.5" height="582.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">DST in New York: a gap in March, an overlap in November</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">America/New_York, 2026. Top line: UTC. Boxes: what a wall clock in New York shows. EST = UTC−5, EDT = UTC−4.</text>
<text x="40.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Sun 2026-03-08: clocks jump forward, 02:00 EST → 03:00 EDT</text>
<text x="40.0" y="167.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">UTC</text>
