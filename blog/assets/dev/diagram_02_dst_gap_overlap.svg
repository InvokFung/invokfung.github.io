<text x="40.0" y="340.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Sun 2026-11-01: clocks fall back, 02:00 EDT → 01:00 EST</text>
