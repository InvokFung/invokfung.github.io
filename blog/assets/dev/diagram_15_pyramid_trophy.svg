<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="1000" height="612" role="img" aria-label="Test pyramid and testing trophy side by side: the pyramid puts most tests in unit tests, the trophy puts most effort in integration tests and adds static checks as the base">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="612" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="610.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">Test pyramid vs testing trophy</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Both are models, not laws: opinions about where to spend effort. The shapes are sketches, not data.</text>
<text x="235.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Test pyramid</text>
<text x="235.0" y="152.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">Mike Cohn, Succeeding with Agile (2009)</text>
<text x="765.0" y="130.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Testing trophy</text>
<text x="765.0" y="152.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">Kent C. Dodds (2018)</text>
<text x="500.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">End-to-end / UI</text>
<text x="500.0" y="221.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">seconds to minutes</text>
<rect x="187.0" y="176.0" width="96.0" height="56.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="235.0" y="209.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">very few</text>
<line x1="291.0" y1="204.0" x2="408.0" y2="204.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<rect x="703.0" y="176.0" width="124.0" height="56.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="765.0" y="209.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">few</text>
<line x1="695.0" y1="204.0" x2="592.0" y2="204.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="500.0" y="268.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">Service / integration</text>
<text x="500.0" y="287.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">seconds</text>
<rect x="142.0" y="242.0" width="186.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="235.0" y="275.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">some</text>
<line x1="336.0" y1="270.0" x2="408.0" y2="270.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<path d="M634.0,254 C600.0,254 600.0,286 634.0,286" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M896.0,254 C930.0,254 930.0,286 896.0,286" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="634.0" y="242.0" width="262.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="765.0" y="275.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">most effort</text>
<line x1="590.0" y1="270.0" x2="592.0" y2="270.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="500.0" y="334.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">Unit</text>
<text x="500.0" y="353.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">milliseconds</text>
<rect x="97.0" y="308.0" width="276.0" height="56.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="235.0" y="341.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">most tests</text>
<line x1="381.0" y1="336.0" x2="408.0" y2="336.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<rect x="679.0" y="308.0" width="172.0" height="56.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="765.0" y="341.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">some</text>
<line x1="671.0" y1="336.0" x2="592.0" y2="336.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="500.0" y="400.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">Static</text>
<text x="500.0" y="419.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">types, lint</text>
<rect x="115" y="380" width="240" height="44" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="235.0" y="407.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" font-style="italic">not part of the model</text>
<rect x="735.0" y="363.0" width="60.0" height="12.0" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="658.0" y="374.0" width="214.0" height="56.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="765.0" y="407.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">the base layer</text>
<line x1="650.0" y1="402.0" x2="592.0" y2="402.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 5"/>
<text x="235.0" y="460.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Fits libraries and logic-heavy code.</text>
<text x="235.0" y="481.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">Martin Fowler's 2012 “TestPyramid” article</text>
<text x="235.0" y="499.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">is a common reference.</text>
<text x="765.0" y="460.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Fits web apps where most bugs live between components.</text>
<text x="765.0" y="481.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">Builds on Guillermo Rauch's line:</text>
<text x="765.0" y="499.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" font-style="italic">“Write tests. Not too many. Mostly integration.”</text>
<rect x="40.0" y="522.0" width="920.0" height="48.0" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="552.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Both agree:</text>
<text x="160.0" y="552.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937" text-anchor="start">E2E tests are few and precious · static checks (types, lint) are cheap wins · every test must earn its cost.</text>
<text x="40.0" y="594.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Sources: Cohn (2009) · Fowler, “TestPyramid” (2012) · Dodds, “The Testing Trophy” (2018). Speeds from the Chapter 1 table.</text>
</svg>