<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" width="1000" height="752" role="img" aria-label="The modern GitHub Pages workflow: a push starts the workflow, the build job uploads the site as the github-pages artifact, the deploy job publishes it with deploy-pages">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="752" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="750.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">One workflow, two jobs: build, then deploy to Pages</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The blog's modern workflow from Chapter 6, labelled with the GitHub Actions building blocks.</text>
<rect x="40.0" y="98.0" width="560.0" height="44.0" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="56.0" y="125.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" letter-spacing="1">EVENT</text>
<text x="118.0" y="125.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">push to main, or workflow_dispatch (a “Run workflow” button)</text>
<line x1="90.0" y1="142.0" x2="90.0" y2="170.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="40" y="174" width="920" height="450" rx="12" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="58.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" letter-spacing="1">WORKFLOW</text>
<text x="160.0" y="202.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Deploy blog to Pages</text>
<text x="58.0" y="226.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">permissions: contents: read</text>
<text x="268.5" y="226.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">(default for all jobs)</text>
<text x="58.0" y="248.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">concurrency: group: pages, cancel-in-progress: false</text>
<text x="456.0" y="248.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">(never cancel a deployment half-way)</text>
<rect x="58.0" y="270.0" width="400.0" height="316.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="74.0" y="298.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d9488" letter-spacing="1">JOB</text>
<text x="114.0" y="298.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#0d9488" text-anchor="start">build</text>
<text x="74.0" y="324.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">runs-on: ubuntu-24.04</text>
<text x="241.5" y="324.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">a fresh VM (the runner)</text>
<text x="74.0" y="346.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">timeout-minutes: 15</text>
<text x="74.0" y="368.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">permissions: contents: read, pages: read</text>
<text x="74.0" y="400.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d9488" letter-spacing="1">STEPS, IN ORDER</text>
<text x="74.0" y="426.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">uses: actions/checkout@v7</text>
<text x="74.0" y="449.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">uses: actions/setup-node@v7</text>
<text x="286.5" y="449.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">node 24, cache: npm</text>
<text x="74.0" y="472.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">run:  npm ci</text>
<text x="74.0" y="495.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">run:  npm run build</text>
<text x="226.5" y="495.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">with NEXT_EXPORT=1</text>
<text x="74.0" y="518.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">uses: actions/configure-pages@v6</text>
<text x="324.0" y="518.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">optional</text>
<text x="74.0" y="541.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">uses: actions/upload-pages-artifact@v5</text>
<text x="369.0" y="541.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">path: out</text>
<text x="74.0" y="570.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">uses: = an action (owner/repo@ref) · run: = a shell command</text>
<rect x="488.0" y="374.0" width="124.0" height="128.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="500.0" y="398.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#d97706" letter-spacing="1">ARTIFACT</text>
<text x="500.0" y="422.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">github-pages</text>
<text x="500.0" y="444.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">a gzip tar</text>
<text x="500.0" y="464.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">kept 1 day</text>
<text x="500.0" y="482.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">by default</text>
<line x1="460.0" y1="438.0" x2="485.0" y2="438.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="550.0" y="526.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">carries the site</text>
<text x="550.0" y="544.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">to the next job</text>
<rect x="642.0" y="270.0" width="300.0" height="316.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="658.0" y="298.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" letter-spacing="1">JOB</text>
<text x="698.0" y="298.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="start">deploy</text>
<text x="658.0" y="324.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">needs: build</text>
<text x="658.0" y="346.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">runs-on: ubuntu-24.04</text>
<text x="658.0" y="368.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">timeout-minutes: 10</text>
<text x="658.0" y="396.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">permissions:</text>
<text x="672.0" y="418.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">pages: write</text>
<text x="772.0" y="418.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">create the deployment</text>
<text x="672.0" y="440.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">id-token: write</text>
<text x="672.0" y="460.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">OIDC token: proves which workflow</text>
<text x="672.0" y="478.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">and branch the deployment comes from</text>
<text x="658.0" y="506.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">environment: github-pages</text>
<text x="658.0" y="538.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed" letter-spacing="1">STEP</text>
<text x="658.0" y="562.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">uses: actions/deploy-pages@v5</text>
<line x1="615.0" y1="438.0" x2="639.0" y2="438.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="792.0" y1="588.0" x2="792.0" y2="647.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="642.0" y="650.0" width="300.0" height="58.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="658.0" y="674.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">GitHub Pages site</text>
<text x="658.0" y="695.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">https://&lt;owner&gt;.github.io/&lt;repository&gt;/</text>
<rect x="40.0" y="650.0" width="572.0" height="58.0" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="56.0" y="674.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2937" text-anchor="start">One-time setting in the repository that runs it:</text>
<text x="56.0" y="695.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Settings → Pages → Build and deployment → Source: GitHub Actions</text>
<text x="40.0" y="734.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Workflow from Chapter 6 of this post · GitHub Docs: workflow syntax; using custom workflows with GitHub Pages.</text>
</svg>