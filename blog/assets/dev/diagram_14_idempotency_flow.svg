<rect x="350.0" y="178.0" width="240.0" height="44.0" rx="22.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<text x="470.0" y="205.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="middle">POST or PATCH?</text>
