<text x="810.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">GET, PUT, DELETE: idempotent already</text>
<line x1="590.0" y1="200.0" x2="658.0" y2="200.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="598.0" y="192.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">no</text>
<rect x="350.0" y="256.0" width="240.0" height="44.0" rx="22.0" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
