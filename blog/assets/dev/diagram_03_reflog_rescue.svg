<text x="56.0" y="733.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">90 days by default; 30 days for commits no longer reachable.</text>
