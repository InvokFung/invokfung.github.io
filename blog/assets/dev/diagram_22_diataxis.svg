<text x="500.0" y="618.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">A good README = a small tutorial (the quickstart) + links to the other three.</text>
