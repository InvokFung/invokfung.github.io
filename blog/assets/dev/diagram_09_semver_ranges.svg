<text x="58.0" y="622.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">So ^1.2.3 keeps the 1 and ^0.2.3 keeps 0.2. ^0.0.3 matches only 0.0.3 (and its pre-releases).</text>
<text x="58.0" y="643.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Treat every 0.x minor bump like a major one. The -0 on each upper bound keeps pre-releases of the next version out.</text>
<text x="40.0" y="682.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Check it yourself: npx semver -r "^0.2.3" 0.2.9 0.3.0 1.2.9 1.3.0   ·   Sources: semver.org 2.0.0, node-semver README.</text>
