<text x="376.1" y="157.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="263.1" cy="179.4" r="12" fill="#d97706"/>
<text x="263.1" y="184.4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="370.1" cy="112.0" r="12" fill="#d97706"/>
<text x="370.1" y="117.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="108.2" cy="333.0" r="12" fill="#d97706"/>
<text x="108.2" y="338.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<circle cx="226.0" cy="374.0" r="12" fill="#d97706"/>
<text x="226.0" y="379.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<circle cx="385.0" cy="554.0" r="12" fill="#d97706"/>
<text x="385.0" y="559.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<circle cx="662.0" cy="163.0" r="12" fill="#d97706"/>
<text x="662.0" y="168.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="684.0" y="168.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">Top of the screen at or slightly below</text>
<text x="684.0" y="189.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">eye level (OSHA)</text>
<circle cx="662.0" cy="225.0" r="12" fill="#d97706"/>
<text x="662.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="684.0" y="230.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">Centre of the screen 15–20° below</text>
<text x="684.0" y="251.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">horizontal eye level (OSHA, AOA)</text>
<circle cx="662.0" cy="287.0" r="12" fill="#d97706"/>
<text x="662.0" y="292.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="684.0" y="292.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">Screen 50–100 cm from the eyes,</text>
<text x="684.0" y="313.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">about an arm's length (OSHA, AAO)</text>
<circle cx="662.0" cy="349.0" r="12" fill="#d97706"/>
<text x="662.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="684.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">Elbows close to the body at 90–120°;</text>
<text x="684.0" y="375.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">keyboard at elbow height (OSHA)</text>
<circle cx="662.0" cy="411.0" r="12" fill="#d97706"/>
<text x="662.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="684.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">Back supported; a slight recline of</text>
<text x="684.0" y="437.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">100–110° is fine (Cornell)</text>
<circle cx="662.0" cy="473.0" r="12" fill="#d97706"/>
<text x="662.0" y="478.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="684.0" y="478.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="start">Whole foot flat on the floor</text>
<text x="684.0" y="499.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">(OSHA)</text>
<rect x="650" y="540" width="320" height="72" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="668.0" y="568.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">20-20-20 for the eyes</text>
<text x="668.0" y="592.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Every 20 min, look ~6 m (20 ft) away for 20 s.</text>
<text x="40.0" y="620.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Sources: OSHA Computer Workstations eTool · AOA · AAO · Cornell University Ergonomics Web.</text>
</svg>