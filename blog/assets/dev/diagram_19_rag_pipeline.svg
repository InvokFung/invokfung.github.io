<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 732" width="1000" height="732" role="img" aria-label="RAG pipeline: index time (load, chunk, embed, store) and query time (embed the question, retrieve top-k, prompt, answer with citations), plus retrieval evaluation">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="732" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="730.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">RAG from scratch: index once, then answer with citations</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Find the few chunks that answer the question, put them in the prompt, and ask for an answer that cites them.</text>
<text x="40.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">INDEX TIME</text>
<text x="144.0" y="118.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">run once, and again when the notes change</text>
<rect x="40.0" y="130.0" width="190.0" height="118.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="135.0" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="middle">1 · Load</text>
<text x="135.0" y="181.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">notes/*.md</text>
<text x="135.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">read as UTF-8,</text>
<text x="135.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">drop the YAML front matter</text>
<line x1="233.0" y1="189.0" x2="246.0" y2="189.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="250.0" y="130.0" width="215.0" height="118.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="357.5" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="middle">2 · Chunk</text>
<text x="357.5" y="181.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">by heading, skipping</text>
<text x="357.5" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">code fences; then windows</text>
<text x="357.5" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">of 800 chars, 150 overlap</text>
<line x1="468.0" y1="189.0" x2="481.0" y2="189.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="485.0" y="130.0" width="215.0" height="118.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="592.5" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="middle">3 · Embed</text>
<text x="592.5" y="181.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">all-MiniLM-L6-v2</text>
<text x="592.5" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">384 numbers per chunk,</text>
<text x="592.5" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">normalised to length 1</text>
<line x1="703.0" y1="189.0" x2="716.0" y2="189.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="720.0" y="130.0" width="240.0" height="118.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="840.0" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="middle">4 · Store</text>
<text x="840.0" y="181.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">rag_index/</text>
<text x="840.0" y="200.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">vectors.npy: one row per chunk</text>
<text x="840.0" y="219.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">chunks.json + meta.json</text>
<text x="40.0" y="310.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">QUERY TIME</text>
<text x="144.0" y="310.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">every question</text>
<rect x="40.0" y="322.0" width="168.0" height="140.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="124.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Question</text>
<text x="124.0" y="373.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">“Why is 0.1 + 0.2</text>
<text x="124.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">not equal to 0.3?”</text>
<line x1="211.0" y1="392.0" x2="224.0" y2="392.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="228.0" y="322.0" width="168.0" height="140.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="312.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Embed</text>
<text x="312.0" y="373.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">the question,</text>
<text x="312.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">with the same model</text>
<text x="312.0" y="411.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">as the index</text>
<line x1="399.0" y1="392.0" x2="412.0" y2="392.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="416.0" y="322.0" width="168.0" height="140.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="500.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Retrieve top-k</text>
<text x="500.0" y="373.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">vectors @ q</text>
<text x="500.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">sort by cosine,</text>
<text x="500.0" y="411.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">keep the best k</text>
<text x="500.0" y="430.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">(start with k = 5)</text>
<line x1="587.0" y1="392.0" x2="600.0" y2="392.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="604.0" y="322.0" width="168.0" height="140.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="688.0" y="350.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Prompt</text>
<text x="688.0" y="373.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">numbered notes,</text>
<text x="688.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">cite each claim [n],</text>
<text x="688.0" y="411.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">say so if not found;</text>
<text x="688.0" y="430.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">notes are data,</text>
<text x="688.0" y="449.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">not instructions</text>
