<text x="510.0" y="492.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">scores this step</text>
<text x="60.0" y="538.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Evaluate retrieval</text>
<text x="60.0" y="562.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">qa.jsonl: a question + the file that answers it.</text>
<text x="60.0" y="594.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start">hit rate@5 = 3 / 4 = 0.75</text>
<text x="60.0" y="613.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Did the right file appear in the top k at all?</text>
<text x="60.0" y="643.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start">MRR@5 = 1.833 / 4 = 0.458</text>
<text x="60.0" y="662.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Average of 1 / rank (0 if missed): rewards near the top.</text>
