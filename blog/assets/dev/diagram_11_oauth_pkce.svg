<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-label="Sequence diagram of the OAuth 2.0 authorization code flow with PKCE between the client, the user's browser, the authorization server and the resource server">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="980" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="978.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<defs><marker id="m-front" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker><marker id="m-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0d9488"/></marker><marker id="m-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker></defs>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">OAuth 2.0: authorization code flow with PKCE</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The flow to use for web apps, single-page apps and mobile apps. The numbers are the six steps in the post.</text>
<line x1="147.5" y1="162.0" x2="147.5" y2="804.0" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 6"/>
<rect x="40.0" y="102.0" width="215.0" height="60.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="147.5" y="128.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="middle">Client</text>
<text x="147.5" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the app, e.g. the printing site</text>
<line x1="382.5" y1="162.0" x2="382.5" y2="804.0" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 6"/>
<rect x="275.0" y="102.0" width="215.0" height="60.0" rx="10" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
<text x="382.5" y="128.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">You, in the browser</text>
<text x="382.5" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the resource owner</text>
<line x1="617.5" y1="162.0" x2="617.5" y2="804.0" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 6"/>
<rect x="510.0" y="102.0" width="215.0" height="60.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="617.5" y="128.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Authorization server</text>
<text x="617.5" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">login + consent, issues tokens</text>
<line x1="852.5" y1="162.0" x2="852.5" y2="804.0" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 6"/>
<rect x="745.0" y="102.0" width="215.0" height="60.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="852.5" y="128.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">Resource server</text>
<text x="852.5" y="148.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">the API, accepts access tokens</text>
<rect x="40.0" y="186.0" width="270.0" height="58.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<circle cx="62.0" cy="215.0" r="11" fill="#1f2937"/>
<text x="62.0" y="219.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82.0" y="210.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937">Make a random </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.0" font-weight="400" fill="#1f2937">code_verifier</tspan></text>
<text x="82.0" y="231.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937">and its hash, the </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.0" font-weight="400" fill="#1f2937">code_challenge</tspan></text>
<circle cx="174.5" cy="277.0" r="11" fill="#1f2937"/>
<text x="174.5" y="281.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="193.5" y="282.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Send the browser to the authorization server</tspan></text>
<text x="193.5" y="303.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">response_type=code, client_id, redirect_uri, scope,</tspan></text>
<text x="193.5" y="322.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">state, code_challenge, code_challenge_method=S256</tspan></text>
<line x1="147.5" y1="340.0" x2="615.5" y2="340.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#m-front)"/>
<circle cx="382.5" cy="340.0" r="5" fill="#ffffff" stroke="#d97706" stroke-width="2.4"/>
<circle cx="409.5" cy="379.0" r="11" fill="#1f2937"/>
<text x="409.5" y="383.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="428.5" y="384.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">You log in there and agree</tspan></text>
<line x1="382.5" y1="402.0" x2="615.5" y2="402.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#m-ink)"/>
<circle cx="174.5" cy="439.0" r="11" fill="#1f2937"/>
<text x="174.5" y="443.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="193.5" y="444.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Redirect the browser back</tspan></text>
<text x="193.5" y="465.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">redirect_uri?code=...&amp;state=...</tspan></text>
<line x1="617.5" y1="483.0" x2="149.5" y2="483.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#m-front)"/>
<circle cx="382.5" cy="483.0" r="5" fill="#ffffff" stroke="#d97706" stroke-width="2.4"/>
<rect x="40.0" y="498.0" width="270.0" height="54.0" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="56.0" y="521.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937">Check that </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.6" font-weight="400" fill="#1f2937">state</tspan><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937"> matches what it sent</tspan></text>
<text x="56.0" y="541.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280">(this blocks CSRF on the callback)</tspan></text>
<circle cx="174.5" cy="585.0" r="11" fill="#1f2937"/>
<text x="174.5" y="589.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="193.5" y="590.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Post to the token endpoint</tspan></text>
<text x="193.5" y="611.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.0" font-weight="400" fill="#1f2937">code</tspan><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937"> + the original </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.0" font-weight="400" fill="#1f2937">code_verifier</tspan></text>
<line x1="147.5" y1="629.0" x2="615.5" y2="629.0" stroke="#0d9488" stroke-width="2.4" marker-end="url(#m-back)"/>
<rect x="485.5" y="646.0" width="264.0" height="58.0" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<circle cx="507.5" cy="675.0" r="11" fill="#1f2937"/>
<text x="507.5" y="679.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="527.5" y="670.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937">Hash the verifier, compare it</tspan></text>
<text x="527.5" y="691.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937">with the challenge from step 2</tspan></text>
<text x="193.5" y="734.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Access token</tspan><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1f2937"> (and maybe a refresh token)</tspan></text>
<line x1="617.5" y1="750.0" x2="149.5" y2="750.0" stroke="#0d9488" stroke-width="2.4" marker-end="url(#m-back)"/>
<rect x="165.5" y="767.0" width="44.0" height="21.0" rx="10.5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="187.5" y="782.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb" text-anchor="middle">then</text>
<text x="217.5" y="782.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" text-anchor="start" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937">Call the API with </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#1f2937">Authorization: Bearer &lt;access token&gt;</tspan></text>
<line x1="147.5" y1="798.0" x2="850.5" y2="798.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#m-api)"/>
<rect x="40.0" y="826.0" width="300.0" height="112.0" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="56.0" y="851.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">How each message travels</text>
<line x1="58.0" y1="871.0" x2="100.0" y2="871.0" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
<path d="M100,866 L110,871 L100,876 Z" fill="#d97706"/>
<text x="122.0" y="876.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">through the browser (redirects)</text>
<line x1="58.0" y1="894.0" x2="100.0" y2="894.0" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
<path d="M100,889 L110,894 L100,899 Z" fill="#0d9488"/>
<text x="122.0" y="899.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">straight between client and server</text>
<line x1="58.0" y1="917.0" x2="100.0" y2="917.0" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
<path d="M100,912 L110,917 L100,922 Z" fill="#2563eb"/>
<text x="122.0" y="922.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the API call, with the access token</text>
<rect x="360.0" y="826.0" width="600.0" height="112.0" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="378.0" y="851.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="start">Why PKCE (RFC 7636)</text>
<text x="540.0" y="851.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937">A stolen </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.0" font-weight="400" fill="#1f2937">code</tspan><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937"> is useless without the </tspan><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.0" font-weight="400" fill="#1f2937">code_verifier</tspan><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937">.</tspan></text>
<text x="378.0" y="875.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937">Redirects carry only its hash; the verifier itself is sent in step 5.</tspan></text>
<text x="378.0" y="899.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" text-anchor="start"><tspan font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937">code_challenge = BASE64URL-ENCODE(SHA256(ASCII(code_verifier)))</tspan></text>
<text x="378.0" y="922.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" text-anchor="start"><tspan font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280">The verifier is 43–128 characters.</tspan></text>
<text x="40.0" y="962.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Sources: RFC 6749 (OAuth 2.0) · RFC 7636 (PKCE) · RFC 9700 (OAuth 2.0 Security BCP).</text>
</svg>