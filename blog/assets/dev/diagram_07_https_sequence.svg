<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">DNS, then TCP (1 round trip), then TLS 1.3 (1 round trip), then HTTP. Violet {…} messages are encrypted.</text>
