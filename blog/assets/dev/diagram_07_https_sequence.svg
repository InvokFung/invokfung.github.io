<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 886" width="1000" height="886" role="img" aria-label="Sequence of an HTTPS request to example.com: DNS lookup, TCP handshake, TLS 1.3 handshake and the HTTP request, with the certificate chain the server sends">
