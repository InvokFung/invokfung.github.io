<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 748" width="1000" height="748" role="img" aria-label="How an LLM picks the next token, and how temperature reshapes the probabilities">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="748" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="746.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">From prompt to next token</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The model scores every token, turns the scores into probabilities, picks one, and repeats.</text>
<text x="40.0" y="122.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">The generation loop</text>
<rect x="40.0" y="140.0" width="164.0" height="96.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="122.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#2563eb" text-anchor="middle">Prompt</text>
<text x="122.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">“The cat sat on the”</text>
<line x1="207.0" y1="188.0" x2="225.0" y2="188.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="229.0" y="140.0" width="164.0" height="96.0" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="311.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0d9488" text-anchor="middle">Tokenizer</text>
<text x="311.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">text → token IDs</text>
<text x="311.0" y="216.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">(integers)</text>
<line x1="396.0" y1="188.0" x2="414.0" y2="188.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="418.0" y="140.0" width="164.0" height="96.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="500.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Transformer</text>
<text x="500.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">one score (logit)</text>
<text x="500.0" y="216.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">per vocabulary token</text>
<line x1="585.0" y1="188.0" x2="603.0" y2="188.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="607.0" y="140.0" width="164.0" height="96.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
