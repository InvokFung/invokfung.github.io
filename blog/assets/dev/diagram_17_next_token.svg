<text x="40.0" y="686.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">As T gets close to 0, sampling becomes greedy: it always picks the top token (“mat”). Even at 0, Anthropic's API is not fully deterministic.</text>
<text x="40.0" y="730.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Logits are made up for teaching (sampling_toy.py in this post). Probabilities are softmax(z / T), rounded to 2 decimals.</text>
