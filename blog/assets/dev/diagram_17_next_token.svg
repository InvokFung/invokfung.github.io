<text x="689.0" y="195.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">softmax(z / T)</text>
<text x="689.0" y="216.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">scores → probabilities</text>
<line x1="774.0" y1="188.0" x2="792.0" y2="188.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="796.0" y="140.0" width="164.0" height="96.0" rx="10" fill="#fef2f2" stroke="#dc4c3a" stroke-width="2"/>
<text x="878.0" y="170.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#dc4c3a" text-anchor="middle">Pick one token</text>
<text x="878.0" y="195.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="middle">a random draw,</text>
<text x="878.0" y="216.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">weighted by probability</text>
<path d="M878.0,238.0 L878.0,270.0 L122.0,270.0 L122.0,242.0" fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="268.0" y="257.0" width="464.0" height="26.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="500.0" y="275.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">Append the picked token to the text, then run the loop again</text>
<text x="500.0" y="300.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="middle">It stops at an end token, a stop sequence, or max_tokens.</text>
<line x1="40.0" y1="328.0" x2="960.0" y2="328.0" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="butt"/>
<text x="40.0" y="356.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Temperature reshapes the same scores</text>
<text x="40.0" y="380.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Made-up logits for the word after “The cat sat on the”, from the post’s sampling_toy.py.</text>
<line x1="215.0" y1="416.0" x2="948.0" y2="416.0" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahm)" marker-start="url(#ahm)"/>
<text x="215.0" y="407.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start">lower T: sharper, more focused</text>
<text x="948.0" y="407.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="end">higher T: flatter, more varied</text>
<text x="40.0" y="450.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start">Next word</text>
