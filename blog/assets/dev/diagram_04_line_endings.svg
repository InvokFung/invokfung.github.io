<text x="40.0" y="602.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">With false, a CRLF file goes into the repository as CRLF. If that file was LF before, Git sees a change on every line.</text>
