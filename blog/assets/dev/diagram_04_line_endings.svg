<text x="754.0" y="548.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">eol=lf → LF</text>
<rect x="846.0" y="541.0" width="84.0" height="32.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
