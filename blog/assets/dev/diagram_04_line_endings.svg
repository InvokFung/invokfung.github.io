<text x="418.0" y="124.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="start">$ cat -A mixed.txt   (^M = CR, $ = end of line)</text>
