<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="Side views of a perspective camera frustum and an orthographic camera box, with what each camera shows on screen">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="660" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="658.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">What a camera can see: perspective vs orthographic</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Side views, not to scale. Both look at the same two equal cubes. Anything past far is clipped.</text>
<rect x="40.0" y="100.0" width="450.0" height="432.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="56.0" y="130.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="start">PerspectiveCamera(fov, aspect, near, far)</text>
<text x="56.0" y="152.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Like a real lens: distant objects look smaller.</text>
<polygon points="174,273.2 420,193.2 420,390.8 174,310.8" fill="#f5f3ff" stroke="none"/>
<line x1="116.0" y1="292.0" x2="174.0" y2="273.2" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="174.0" y1="273.2" x2="420.0" y2="193.2" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
<line x1="116.0" y1="292.0" x2="174.0" y2="310.8" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="174.0" y1="310.8" x2="420.0" y2="390.8" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
<line x1="174.0" y1="273.2" x2="174.0" y2="310.8" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
<line x1="420.0" y1="193.2" x2="420.0" y2="390.8" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
<rect x="82.0" y="280.0" width="26.0" height="24.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<path d="M108.0,285.0 L116.0,281.0 L116.0,303.0 L108.0,299.0 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M148.3,302.5 A34,34 0 0 0 148.3,281.5" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="138.0" y="266.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">fov</text>
<text x="174.0" y="328.8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">near</text>
<text x="420.0" y="185.2" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">far</text>
<rect x="221.0" y="263.0" width="26" height="26" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<rect x="361.0" y="301.0" width="26" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="437.0" y="283.0" width="26" height="26" rx="3" fill="#f9fafb" stroke="#1f2937" stroke-width="2" opacity="0.35"/>
<text x="450.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">clipped</text>
<text x="60.0" y="412.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Typical: fov 45–75 (games), 25–35 (cinematic),</text>
<text x="60.0" y="430.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">near 0.1, far 1000</text>
<rect x="290.0" y="450.0" width="136.0" height="68.0" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/>
<rect x="319.3" y="458.3" width="23.1" height="23.1" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<rect x="382.6" y="487.7" width="10.5" height="10.5" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="276.0" y="480.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end">On screen:</text>
<text x="276.0" y="498.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">far cube is smaller</text>
<rect x="510.0" y="100.0" width="450.0" height="432.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="526.0" y="130.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0d9488" text-anchor="start">OrthographicCamera(left, right, top, bottom, near, far)</text>
<text x="526.0" y="152.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Parallel projection: same size at any distance.</text>
<rect x="644.0" y="220.0" width="246.0" height="144.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="0"/>
<line x1="586.0" y1="220.0" x2="644.0" y2="220.0" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="644.0" y1="220.0" x2="890.0" y2="220.0" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
<line x1="586.0" y1="364.0" x2="644.0" y2="364.0" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="644.0" y1="364.0" x2="890.0" y2="364.0" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
<line x1="644.0" y1="220.0" x2="644.0" y2="364.0" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
<line x1="890.0" y1="220.0" x2="890.0" y2="364.0" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
<line x1="586.0" y1="220.0" x2="586.0" y2="364.0" stroke="#0d9488" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
<rect x="552.0" y="280.0" width="26.0" height="24.0" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<path d="M578.0,285.0 L586.0,281.0 L586.0,303.0 L578.0,299.0 Z" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="654.0" y="240.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="start">top = d</text>
<text x="654.0" y="354.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="start">bottom = −d</text>
<text x="644.0" y="212.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">near</text>
<text x="890.0" y="212.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">far</text>
<rect x="691.0" y="263.0" width="26" height="26" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<rect x="831.0" y="301.0" width="26" height="26" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="907.0" y="283.0" width="26" height="26" rx="3" fill="#f9fafb" stroke="#1f2937" stroke-width="2" opacity="0.35"/>
<text x="920.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7280" text-anchor="middle">clipped</text>
<text x="530.0" y="412.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">left = −d × aspect, right = d × aspect</text>
<text x="530.0" y="430.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Used for 2D, isometric, CAD, minimaps.</text>
<rect x="760.0" y="450.0" width="136.0" height="68.0" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.2"/>
<rect x="794.7" y="470.3" width="12.3" height="12.3" rx="2" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
<rect x="851.8" y="488.2" width="12.3" height="12.3" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="746.0" y="480.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end">On screen:</text>
<text x="746.0" y="498.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="end">same size</text>
<rect x="40.0" y="548.0" width="920.0" height="64.0" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="574.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Keep far / near below ~10⁴</text>
<text x="60.0" y="595.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">or use logarithmicDepthBuffer: true (avoids z-fighting)</text>
<text x="520.0" y="574.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Changed fov, aspect, near or far?</text>
<text x="520.0" y="595.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">call camera.updateProjectionMatrix()</text>
<line x1="500.0" y1="560.0" x2="500.0" y2="600.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
<text x="40.0" y="642.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: this post, Chapters 2 and 3 (PerspectiveCamera, OrthographicCamera, the near/far rule).</text>
</svg>