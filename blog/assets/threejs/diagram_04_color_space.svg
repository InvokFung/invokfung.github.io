<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" width="1000" height="704" role="img" aria-label="Colour textures are marked sRGB and converted to linear; data textures such as normal and packed ORM maps are used as-is; the linear render is converted back to sRGB for the screen">
