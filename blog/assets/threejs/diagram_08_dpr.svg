<text x="604.0" y="186.5" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#5eead4" text-anchor="start">  Math.min(window.devicePixelRatio, 2)</text>
<text x="604.0" y="207.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#e2e8f0" text-anchor="start">);</text>
<rect x="590" y="246" width="4" height="82" rx="2" fill="#0d9488"/>
<text x="606.0" y="262.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="start">Standard: cap at 2</text>
<text x="606.0" y="284.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">1.28 MP instead of 2.88 MP:</text>
<text x="606.0" y="304.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">2.25× fewer pixels than DPR 3.</text>
<text x="606.0" y="324.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Visual difference: essentially invisible.</text>
<rect x="590" y="356" width="4" height="42" rx="2" fill="#d97706"/>
<text x="606.0" y="372.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706" text-anchor="start">Low-end devices: cap at 1.5 or 1</text>
<text x="606.0" y="394.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Combine it with a quality slider.</text>
<rect x="590" y="426" width="4" height="62" rx="2" fill="#dc4c3a"/>
<text x="606.0" y="442.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc4c3a" text-anchor="start">Post-processing pays it again</text>
<text x="606.0" y="464.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Each pass is another full-screen render:</text>
<text x="606.0" y="484.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">1.28 MP per pass at DPR 2.</text>
<text x="40.0" y="572.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">MP = million pixels. Pixels = (400 × ratio) × (800 × ratio). Numbers from the post's Chapter 1 and Chapter 8.</text>
</svg>