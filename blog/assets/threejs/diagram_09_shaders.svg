<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">The vertex shader runs once per vertex, the fragment shader once per pixel. Names from the post's ShaderMaterial example.</text>
