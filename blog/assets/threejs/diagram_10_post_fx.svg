<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">composer.render() replaces renderer.render(). Each pass reads the previous render target and writes a new one.</text>
