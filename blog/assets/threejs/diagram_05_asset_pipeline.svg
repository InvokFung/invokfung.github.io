<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 722" width="1000" height="722" role="img" aria-label="glTF asset pipeline: export a .glb, optimise it with gltf-transform at build time, then load it with GLTFLoader and the matching decoders">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="722" rx="14" fill="#ffffff"/>
<rect x="0.75" y="0.75" width="998.5" height="720.5" rx="14" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">The glTF asset pipeline</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Export once, compress at build time, decode in the browser. A typical 5 MB glTF can shrink to 500 KB.</text>
<text x="40.0" y="112.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">1  AUTHOR</text>
<rect x="40.0" y="126.0" width="196.0" height="426.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="250.0" y="112.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">2  OPTIMISE (build time)</text>
<rect x="250.0" y="126.0" width="370.0" height="426.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="646.0" y="112.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="start">3  LOAD (in the browser)</text>
<rect x="646.0" y="126.0" width="314.0" height="426.0" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="58.0" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">3D tool</text>
<text x="58.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Blender, Maya, 3ds Max,</text>
<text x="58.0" y="204.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Houdini, Cinema 4D,</text>
<text x="58.0" y="224.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Substance, ZBrush</text>
<line x1="98.0" y1="242.0" x2="98.0" y2="294.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="110.0" y="272.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">export</text>
<rect x="58.0" y="303.2" width="91.1" height="25.5" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="103.6" y="320.9" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">model.glb</text>
<text x="58.0" y="352.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">glTF 2.0 in one binary</text>
<text x="58.0" y="372.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">file: the right default</text>
<text x="58.0" y="392.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">for the web.</text>
<text x="58.0" y="508.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Tip: name meshes and</text>
<text x="58.0" y="528.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">bones before export.</text>
<text x="268.0" y="158.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">gltf-transform</text>
<text x="412.8" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">the post's pipeline</text>
<line x1="276.0" y1="198.0" x2="276.0" y2="394.0" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
<circle cx="276" cy="198" r="4.5" fill="#9ca3af"/>
<rect x="292.0" y="185.5" width="57.1" height="25.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.3"/>
<text x="320.6" y="202.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">dedup</text>
<text x="462.0" y="203.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">remove duplicates</text>
<circle cx="276" cy="240" r="4.5" fill="#9ca3af"/>
<rect x="292.0" y="227.5" width="49.3" height="25.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.3"/>
<text x="316.7" y="244.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">weld</text>
<text x="462.0" y="245.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">merge close vertices</text>
<circle cx="276" cy="282" r="4.5" fill="#9ca3af"/>
<rect x="292.0" y="269.5" width="158.9" height="25.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.3"/>
<text x="371.4" y="286.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">resize --size 1024</text>
<text x="462.0" y="287.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">cap texture size</text>
<circle cx="276" cy="324" r="4.5" fill="#d97706"/>
<rect x="292.0" y="311.5" width="57.1" height="25.0" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
<text x="320.6" y="328.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">uastc</text>
<text x="462.0" y="329.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">KTX2 for hero textures</text>
<circle cx="276" cy="366" r="4.5" fill="#7c3aed"/>
<rect x="292.0" y="353.5" width="72.8" height="25.0" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3"/>
<text x="328.4" y="370.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">meshopt</text>
<text x="462.0" y="371.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">compress geometry</text>
<line x1="276.0" y1="384.0" x2="276.0" y2="396.0" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="268.0" y="399.2" width="91.1" height="25.5" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="313.6" y="416.9" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">final.glb</text>
<rect x="268.0" y="448.0" width="334.0" height="94.0" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="282.0" y="472.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">Other choices</text>
<text x="282.0" y="496.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#0d9488" text-anchor="start">draco</text>
<text x="352.0" y="496.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Draco instead of meshopt</text>
<text x="282.0" y="520.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">optimize</text>
<text x="352.0" y="520.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">one command, sane defaults</text>
<text x="664.0" y="158.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">GLTFLoader</text>
<text x="770.3" y="158.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">+ decoders</text>
<rect x="664.0" y="176.0" width="284.0" height="46.0" rx="7" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
<rect x="664.0" y="176.0" width="5.0" height="46.0" rx="2" fill="#0d9488" stroke="none" stroke-width="0"/>
<text x="676.0" y="195.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#0d9488" text-anchor="start">.setDRACOLoader(draco)</text>
<text x="676.0" y="213.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Draco geometry, ~250 KB decoder</text>
<rect x="664.0" y="230.0" width="284.0" height="46.0" rx="7" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<rect x="664.0" y="230.0" width="5.0" height="46.0" rx="2" fill="#d97706" stroke="none" stroke-width="0"/>
<text x="676.0" y="249.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#d97706" text-anchor="start">.setKTX2Loader(ktx2)</text>
<text x="676.0" y="267.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">KTX2 textures, ~700 KB transcoder</text>
<rect x="664.0" y="284.0" width="284.0" height="46.0" rx="7" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
<rect x="664.0" y="284.0" width="5.0" height="46.0" rx="2" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="676.0" y="303.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="start">.setMeshoptDecoder(MeshoptDecoder)</text>
<text x="676.0" y="321.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Meshopt geometry, tiny decoder</text>
<text x="664.0" y="358.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">gltf = await loader.loadAsync(url)</text>
<line x1="694.0" y1="368.0" x2="694.0" y2="390.0" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="664.0" y="397.5" width="96.3" height="25.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="712.1" y="414.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">gltf.scene</text>
<text x="664.0" y="440.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">a Group: traverse it for shadows</text>
<text x="664.0" y="458.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">and materials, then scene.add()</text>
<rect x="664.0" y="467.5" width="135.4" height="25.0" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="731.7" y="484.7" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">gltf.animations</text>
<text x="664.0" y="510.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">AnimationClip[] (Post 06)</text>
<path d="M152.1,316.0 L243.0,316.0 L243.0,198.0 L268.0,198.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M362.1,412.0 L633.0,412.0 L633.0,153.0 L659.0,153.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="40.0" y="568.0" width="920.0" height="110.0" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60.0" y="596.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Geometry: Draco or Meshopt, not both</text>
<text x="60.0" y="620.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Meshopt keeps animations and morph targets;</text>
<text x="60.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Draco drops them. Animated model? Use Meshopt.</text>
<text x="520.0" y="596.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Textures: KTX2</text>
<text x="520.0" y="620.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">UASTC for hero textures and normal maps,</text>
<text x="520.0" y="640.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">ETC1S for the rest. About 10× less GPU memory.</text>
<line x1="500.0" y1="582.0" x2="500.0" y2="644.0" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
<text x="60.0" y="666.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Same colour = the step and the decoder that must match. A missing decoder makes GLTFLoader throw an error.</text>
<text x="40.0" y="704.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: this post, Chapters 1, 3, 4 and 5 (glTF, the three compressions, gltf-transform, traversal).</text>
