<text x="56.0" y="193.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#5eead4" text-anchor="start">  &lt;ambientLight intensity={0.3} /&gt;</text>
<text x="56.0" y="225.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#5eead4" text-anchor="start">  &lt;directionalLight castShadow /&gt;</text>
<text x="56.0" y="257.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#5eead4" text-anchor="start">  &lt;mesh position={[0, 1, 0]}&gt;</text>
<text x="56.0" y="289.0" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13.5" font-weight="400" fill="#5eead4" text-anchor="start">    &lt;boxGeometry args={[1, 1, 1]} /&gt;</text>
