<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img" aria-label="Java Collections framework: interfaces Iterable, Collection, List, Set, Queue, Deque and Map, with the concrete classes to choose">
