<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">aₙ = (2n+1)/(n+3) → 2.  Distance to the limit: |aₙ − 2| = 5/(n+3).  Here ε = 0.25.</text>
