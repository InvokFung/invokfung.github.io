<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Inside the δ-window around c, the graph must stay inside the ε-band around f(c).  Here ε = 1.</text>
