<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Two panels. Left: x squared near 3 with epsilon 1; the delta window of 1/7 on each side of 3 keeps the graph inside the band from 8 to 10. Right: 1 over x on (0, 1] with epsilon 1; the largest working delta shrinks from 1/2 at c = 1 to 1/6 at c = 1/2 and 1/20 at c = 1/4, so no single delta works for every point.">
