<text x="422.2" y="242.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">a₂ = 1/2</text>
<text x="525.9" y="242.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">a₃ = 2/3</text>
<text x="640.0" y="242.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="end">s − ε = 0.85</text>
<line x1="640.0" y1="200.0" x2="640.0" y2="226.0" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/>
