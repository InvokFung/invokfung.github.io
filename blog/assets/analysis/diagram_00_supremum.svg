<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 606" width="1000" height="606" role="img" aria-label="Two number lines. Top: the set of numbers 1 minus 1 over n with supremum 1, which is not in the set; every number 1 or larger is an upper bound, and the window from 0.85 to 1 contains 6/7, so 0.85 is not an upper bound. Bottom: rationals whose square is below 2 and rational upper bounds close in on a gap at the square root of 2.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/></marker></defs>
