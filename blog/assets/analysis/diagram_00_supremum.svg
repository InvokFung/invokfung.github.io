<circle cx="700" cy="468" r="5.5" fill="#d97706"/>
<text x="700.0" y="452.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="middle">1.42</text>
<circle cx="636" cy="468" r="5.5" fill="#d97706"/>
<text x="636.0" y="452.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97706" text-anchor="middle">1.415</text>
<text x="525.0" y="452.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">…</text>
