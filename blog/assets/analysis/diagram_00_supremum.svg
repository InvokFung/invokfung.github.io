<text x="40.0" y="50.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="start">The supremum: the least upper bound</text>
<text x="40.0" y="76.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#6b7280" text-anchor="start">Nothing in A lies to the right of s, and every window (s − ε, s] contains a point of A.</text>
<rect x="24.0" y="96.0" width="952.0" height="236.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="44.0" y="124.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d9488" text-anchor="start">A = { 1 − 1/n : n = 1, 2, 3, … }</text>
<text x="44.0" y="146.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">sup A = 1, but 1 is not in A (no maximum)</text>
<rect x="733.3" y="170.0" width="186.7" height="30.0" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
<text x="826.7" y="190.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">upper bounds: every b ≥ 1</text>
