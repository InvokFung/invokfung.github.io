<text x="560.0" y="498.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc4c3a" text-anchor="middle">√2 ∉ ℚ: a gap</text>
<line x1="140.0" y1="490.0" x2="470.0" y2="490.0" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="300.0" y="510.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">in S (square below 2), e.g. 1.414² = 1.999396</text>
<line x1="830.0" y1="490.0" x2="650.0" y2="490.0" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="790.0" y="510.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">upper bounds, e.g. 1.415² = 2.002225</text>
<text x="44.0" y="540.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Every rational upper bound can be improved. In ℝ the Axiom of Completeness fills the gap: sup S = √2.</text>
<text x="40.0" y="588.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af" text-anchor="start">Source: Real Analysis 00, Chapter 3 (examples, ε-characterization, why ℚ fails the Axiom of Completeness).</text>
