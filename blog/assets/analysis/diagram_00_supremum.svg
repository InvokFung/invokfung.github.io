<line x1="644.4" y1="252.0" x2="644.4" y2="262.0" stroke="#7c3aed" stroke-width="1.4" stroke-linecap="round"/>
<text x="604.4" y="278.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">a₇ = 6/7 ≈ 0.857 &gt; 0.85, so 0.85 is not an upper bound</text>
<text x="44.0" y="312.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">ε-test: s is the sup exactly when s is an upper bound and, for every ε &gt; 0, some a in A has a &gt; s − ε.</text>
<rect x="24.0" y="350.0" width="952.0" height="206.0" rx="12" fill="#fbfbfc" stroke="#e5e7eb" stroke-width="1.4"/>
<text x="44.0" y="378.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc4c3a" text-anchor="start">In ℚ: S = { r ∈ ℚ : r² &lt; 2 } has no least upper bound</text>
<text x="44.0" y="400.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">positions are not to scale: both lists close in on the same point from the two sides</text>
