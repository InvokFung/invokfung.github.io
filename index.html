<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alan Fung · Software Engineer</title>
<meta name="description" content="Alan Fung (InvokFung), software engineer. A portfolio that is also its own source code: scroll to step through it, edit the live values to recompile it." />
<meta name="theme-color" content="#0b0d12" />
<meta property="og:title" content="Alan Fung · Software Engineer" />
<meta property="og:description" content="A portfolio you can step through and recompile." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://invokfung.github.io/" />
<link rel="icon" href="/blog/assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/portfolio/style.css" />
<script>
  // Apply the saved theme before first paint so there is no flash.
  try {
    var s = JSON.parse(localStorage.getItem("alan.fung/config") || "null");
    var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = (s && s.theme) || (light ? "paper" : "midnight");
    if (s && s.accent) document.documentElement.style.setProperty("--acc", s.accent);
  } catch (e) {}
</script>
</head>
<body>
  <div class="field" aria-hidden="true"></div>

  <div class="app">
    <aside class="editor" id="editor" aria-label="The source code of this page">
      <div class="ed-bar">
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="tab" id="tab"><span class="glyph">ƒ</span>alan.fung<span class="dirty" title="edited"></span></div>
        <div class="ed-actions">
          <button type="button" id="btn-reset" title="Reset live values">⟲ reset</button>
          <button type="button" id="btn-term" title="Open terminal (press `)">›_ term</button>
          <button type="button" id="btn-close" class="only-mobile" title="Close source">✕</button>
        </div>
      </div>
      <div class="code" id="code" tabindex="-1"></div>
      <div class="ed-watch" id="watch" aria-hidden="true"></div>
      <div class="ed-status" id="status"></div>
    </aside>

    <main class="out" id="out">
      <noscript>
        <section class="sec">
          <h2 class="title">Alan Fung</h2>
          <p class="lede">Software engineer, dedicated to programming. This page is an interactive program and needs JavaScript. Meanwhile: <a href="/blog/">StudyLog</a> · <a href="/ptimer/">ChillTimer</a> · <a href="/triplefind/">TripleFind</a> · <a href="https://github.com/InvokFung">GitHub</a></p>
        </section>
      </noscript>
    </main>
  </div>

  <div class="strip" id="strip">
    <span class="at" id="strip-at">▶ 1</span>
    <code id="strip-line"></code>
    <button type="button" id="strip-term" aria-label="Open terminal">›_</button>
    <button type="button" id="strip-src" aria-expanded="false" aria-controls="editor">{ } source</button>
  </div>

  <div class="term" id="term" role="dialog" aria-label="Terminal" hidden>
    <div class="term-bar"><span>alan@fung: ~ · zsh</span><button type="button" id="term-x" aria-label="Close terminal">esc ✕</button></div>
    <div class="term-out" id="term-out" aria-live="polite"></div>
    <form class="term-in" id="term-form" autocomplete="off">
      <label for="term-input">alan@fung:~$</label>
      <input id="term-input" spellcheck="false" autocapitalize="off" placeholder="type help" />
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/assets/portfolio/data.js"></script>
  <script src="/assets/portfolio/app.js"></script>
</body>
</html>
