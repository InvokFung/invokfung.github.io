# Example only: create the real secret out of band, e.g.
#   kubectl -n triplefind-arena create secret generic arena-secrets \
#     --from-literal=ARENA_SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ARENA_MONGO_URL='mongodb+srv://user:pass@cluster.example.net'
# Every replica must share ARENA_SESSION_SECRET: resume tokens are HMACs, so a player
# who reconnects to a different pod is still recognised.
apiVersion: v1
kind: Secret
metadata:
  name: arena-secrets
  namespace: triplefind-arena
type: Opaque
stringData:
  ARENA_SESSION_SECRET: replace-with-32-random-bytes-hex
  ARENA_MONGO_URL: mongodb://mongo.triplefind-arena.svc.cluster.local:27017
