apiVersion: v1
kind: ConfigMap
metadata:
  name: arena-config
  namespace: triplefind-arena
  labels:
    app.kubernetes.io/name: arena
data:
  ARENA_STORE: mongo
  ARENA_MONGO_DB: triplefind_arena
  # Origins that may open a socket (the GitHub Pages site and the API host itself).
  ARENA_ALLOWED_ORIGINS: https://invokfung.github.io
  # Quick match waits this long for humans, then fills the table with bots.
  ARENA_FILL_MS: "3000"
  ARENA_BOT_FILL_MS: "8000"
  # On SIGTERM: report not-ready this long before closing sockets (must be < terminationGracePeriodSeconds).
  ARENA_DRAIN_MS: "10000"
  LOG_LEVEL: info
