# CPU is the bottleneck that matters here (the load test: ~1/3 of a core for 1000 active
# clients). Scale-in is slow on purpose: removing a pod ends the sockets on it, and the
# players reconnect (and resume) on another pod, but live matches on it are abandoned.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arena
  namespace: triplefind-arena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arena
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
